# The protected reusable signer. It runs only through workflow_call, from the release caller, which holds
# the rdy-core-release-authority lane; this callee never locks the lane again. Its scripts are the trusted
# tree at the revision the run really referenced, never the caller's checkout. Candidate bytes are data
# only: no candidate code, hook or build script runs here.
#
# The claims job measures the OIDC identity with nothing else: it requests a token for sts.amazonaws.com,
# reports the allowlisted nonsecret claims and stops. The verifier job builds qa-release-trust at the same
# revision, with no OIDC and no environment. The sign job holds the one OIDC request: sign.py keeps the token
# and the session credentials in temporary mode-0600 files, removes them on every exit, reads no ambient
# credential or config file and uses no SSH agent.
name: release-sign
on:
  workflow_call:
    inputs:
      mode:
        description: claims measures the identity; live signs the reserved release
        type: string
        required: true
      signer_sha:
        description: The literal full SHA in the caller's uses line
        type: string
        required: true
      request:
        description: The release request JSON (live only); authority never comes from it
        type: string
        required: false
        default: ""
      reserve_artifact_id:
        description: The reserve job's receipt artifact, in this run attempt (live only; empty on a retry)
        type: string
        required: false
        default: ""
    outputs:
      signature_artifact_id:
        description: The artifact that holds SHA256SUMS.sig, authorization.json and sign-receipt.json
        value: ${{ jobs.sign.outputs.artifact_id }}
      signature_artifact_digest:
        description: Its artifact-service digest
        value: ${{ jobs.sign.outputs.artifact_digest }}
permissions: {}
jobs:
  revision:
    name: Signer revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.bind.outputs.sha }}
    steps:
      # The input alone proves nothing. This step is the callee's own text at H: it accepts the input only
      # if GitHub says this run referenced this callee at exactly that literal revision.
      - name: Bind the input to the run's referenced workflow
        id: bind
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIGNER_SHA: ${{ inputs.signer_sha }}
          SIGNER_MODE: ${{ inputs.mode }}
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import json, os, re, sys, urllib.request
          sha, mode = os.environ['SIGNER_SHA'], os.environ['SIGNER_MODE']
          if mode not in ('claims', 'live') or not re.fullmatch(r'[0-9a-f]{40}', sha):
              sys.exit('release controller: the signer input is malformed')
          url = ('https://api.github.com/repos/adrenickchrome/rdy-core/actions/runs/' + os.environ['GITHUB_RUN_ID']
                 + '/attempts/' + os.environ['GITHUB_RUN_ATTEMPT'])
          request = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'rdy-release-controller'})
          with urllib.request.urlopen(request, timeout=60) as stream:
              run = json.loads(stream.read(4194304))
          prefix = 'adrenickchrome/rdy-core/.github/workflows/release-sign.yml@'
          found = [r for r in run.get('referenced_workflows') or [] if str(r.get('path', '')).startswith(prefix)]
          if len(found) != 1 or found[0].get('sha') != sha or found[0]['path'] != prefix + sha:
              sys.exit('release controller: the run did not reference this signer at that literal revision')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + sha + '\n')
          PY
  claims:
    name: Signer identity claims
    needs: revision
    if: inputs.mode == 'claims'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adrenickchrome/rdy-core
          ref: ${{ needs.revision.outputs.sha }}
          path: trusted
          persist-credentials: false
      - name: Report the nonsecret identity claims
        run: /usr/bin/python3 -I -B trusted/scripts/release/sign.py claims --out "$RUNNER_TEMP/claims.json"
  verifier:
    name: Trusted verifier
    needs: revision
    if: inputs.mode == 'live'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adrenickchrome/rdy-core
          ref: ${{ needs.revision.outputs.sha }}
          path: trusted
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Build qa-release-trust at the trusted revision
        id: build
        working-directory: trusted
        run: |
          cargo build --locked --release -p rdy-qa --bin qa-release-trust
          echo "sha256=$(sha256sum target/release/qa-release-trust | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trusted-verifier-a${{ github.run_attempt }}
          path: trusted/target/release/qa-release-trust
          if-no-files-found: error
          retention-days: 1
  sign:
    name: Sign reserved manifest
    needs: [revision, verifier]
    if: inputs.mode == 'live'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adrenickchrome/rdy-core
          ref: ${{ needs.revision.outputs.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trusted-verifier-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/rdy-signer-verifier
      - name: Install the pinned AWS CLI
        run: >-
          /usr/bin/python3 -I -B trusted/scripts/release/install_aws.py
          --tools trusted/scripts/release/tools.json --work "$RUNNER_TEMP/rdy-signer-aws"
      - name: Sign, or recover the retained signature
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RDY_RELEASE_REQUEST: ${{ inputs.request }}
          RDY_RESERVE_ARTIFACT_ID: ${{ inputs.reserve_artifact_id }}
          RDY_RELEASE_ENROLLMENT: ${{ vars.RDY_RELEASE_ENROLLMENT }}
          RDY_RELEASE_ROLE_ARN: ${{ vars.RDY_RELEASE_ROLE_ARN }}
          SIGNER_SHA: ${{ needs.revision.outputs.sha }}
          VERIFIER_SHA256: ${{ needs.verifier.outputs.sha256 }}
        run: >-
          /usr/bin/python3 -I -B trusted/scripts/release/sign.py live
          --signer-sha "$SIGNER_SHA" --trusted trusted --aws-bin "$RUNNER_TEMP/rdy-signer-aws/bin"
          --verifier "$RUNNER_TEMP/rdy-signer-verifier/qa-release-trust" --verifier-sha256 "$VERIFIER_SHA256"
          --work "$RUNNER_TEMP/rdy-signer-work" --out "$RUNNER_TEMP/rdy-signer-out"
      # Transport only: the journal is the record. The promotion job authenticates these bytes again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: rdy-signature-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rdy-signer-out/SHA256SUMS.sig
            ${{ runner.temp }}/rdy-signer-out/authorization.json
            ${{ runner.temp }}/rdy-signer-out/sign-receipt.json
          if-no-files-found: error
          retention-days: 90
      # How far this invocation got, for a later attempt. A job with none of this is unknown, never clean.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: sign-stop-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rdy-signer-out/sign-stop.json
            ${{ runner.temp }}/rdy-signer-out/sign-evidence.jsonl
          if-no-files-found: warn
          retention-days: 90
      - name: Remove the session and the installed tools
        if: success() || failure()
        run: rm -rf "$RUNNER_TEMP/rdy-signer-work" "$RUNNER_TEMP/rdy-signer-aws" "$RUNNER_TEMP/rdy-signer-verifier"
