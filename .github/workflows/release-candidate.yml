        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo qa --skip-perf --require-all
      - name: Failing tests
        # The log names the cause: the qa report's failing gates, tests and panic excerpts.
        if: failure()
        run: |
          test -f target/qa/report.md || { echo "No qa report at target/qa/report.md"; exit 0; }
          grep -E '^\|.*\| FAIL \|' target/qa/report.md || true
          sed -n '/^Failing in/,/^## Perf/p' target/qa/report.md
      - name: Upload the qa report
        # Named qa-report-*, never rdy-candidate-*: candidate.py's build artifact names stay unique.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-report-aarch64-apple-darwin-a${{ github.run_attempt }}
          path: target/qa/report.*
          if-no-files-found: warn
          retention-days: 14
      - name: Fast gate counts
        run: >-
          python3 -B scripts/release/candidate.py gate-counts --report target/qa/report.json
          --commit "$COMMIT" --out "$RUNNER_TEMP/fast-gate.json"
      - name: No tracked file changed
        run: git diff --exit-code
      - name: Build from git archive, package and inspect
        run: >-
          python3 -B scripts/release/candidate.py build --repo "$GITHUB_WORKSPACE" --commit "$COMMIT"
          --version "$VERSION" --target aarch64-apple-darwin --work "$RUNNER_TEMP/rdy-candidate"
          --fast-gate "$RUNNER_TEMP/fast-gate.json" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --out "$RUNNER_TEMP/candidate-out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: rdy-candidate-aarch64-apple-darwin-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
  build-linux:
    name: Native candidate (x86_64-unknown-linux-gnu)
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      COMMIT: ${{ needs.check.outputs.commit }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Candidate is still unreserved
        # Again here: a re-run of a failed build job does not re-run the check job.
        env:
          CANDIDATE_REF: ${{ github.ref }}
        run: >-
          python3 -B scripts/release/candidate.py check-ref --repo "$GITHUB_WORKSPACE"
          --ref "$CANDIDATE_REF" --sha "$COMMIT" --main refs/remotes/origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: Not root
        run: test "$(id -u)" -ne 0
      - name: Locked dependencies
        run: cargo fetch --locked
      - name: Native fast gate (fmt, clippy, tests; no perf)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo qa --skip-perf --require-all
      - name: Failing tests
        # The log names the cause: the qa report's failing gates, tests and panic excerpts.
        if: failure()
        run: |
          test -f target/qa/report.md || { echo "No qa report at target/qa/report.md"; exit 0; }
          grep -E '^\|.*\| FAIL \|' target/qa/report.md || true
          sed -n '/^Failing in/,/^## Perf/p' target/qa/report.md
      - name: Upload the qa report
        # Named qa-report-*, never rdy-candidate-*: candidate.py's build artifact names stay unique.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-report-x86_64-unknown-linux-gnu-a${{ github.run_attempt }}
          path: target/qa/report.*
          if-no-files-found: warn
          retention-days: 14
      - name: Fast gate counts
        run: >-
          python3 -B scripts/release/candidate.py gate-counts --report target/qa/report.json
          --commit "$COMMIT" --out "$RUNNER_TEMP/fast-gate.json"
      - name: No tracked file changed
        run: git diff --exit-code
      - name: Build from git archive, package and inspect
        run: >-
          python3 -B scripts/release/candidate.py build --repo "$GITHUB_WORKSPACE" --commit "$COMMIT"
          --version "$VERSION" --target x86_64-unknown-linux-gnu --work "$RUNNER_TEMP/rdy-candidate"
          --fast-gate "$RUNNER_TEMP/fast-gate.json" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --out "$RUNNER_TEMP/candidate-out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: rdy-candidate-x86_64-unknown-linux-gnu-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
  build-windows:
    name: Native candidate (x86_64-pc-windows-msvc)
    needs: check
    runs-on: windows-2025
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      COMMIT: ${{ needs.check.outputs.commit }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Candidate is still unreserved
        # Again here: a re-run of a failed build job does not re-run the check job.
        shell: pwsh
        env:
          CANDIDATE_REF: ${{ github.ref }}
        run: >-
          python -B scripts/release/candidate.py check-ref --repo $env:GITHUB_WORKSPACE
          --ref $env:CANDIDATE_REF --sha $env:COMMIT --main refs/remotes/origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Native fast gate (fmt, clippy, tests; no perf) under a standard account
        # The same gate as the platform check: a temporary standard account, a private checkout and
        # `cargo qa --skip-perf --require-all`. The script exits with the gate's own status.
        shell: pwsh
        env:
          RDY_QA_HOSTED_CI: "1"
        run: ./scripts/ci/windows_gate.ps1
      - name: Qa report, failing tests and counts
        # The log names the cause: the qa report's failing gates, tests and panic excerpts.
        if: failure()
        shell: pwsh
        run: ./scripts/ci/windows_report.ps1 -Report "$env:RDY_CI_ROOT\work\target\qa\report.md"
      - name: Upload the qa report and gate logs
        # Named qa-report-*, never rdy-candidate-*: candidate.py's build artifact names stay unique.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-report-x86_64-pc-windows-msvc-a${{ github.run_attempt }}
          path: |
            ${{ env.RDY_CI_ROOT }}\work\target\qa\report.*
            ${{ env.RDY_CI_ROOT }}\logs\gate.*
          if-no-files-found: warn
          retention-days: 14
      - name: Fast gate counts
        shell: pwsh
        run: >-
          python -B scripts/release/candidate.py gate-counts --report "$env:RDY_CI_ROOT\work\target\qa\report.json"
          --commit $env:COMMIT --out "$env:RUNNER_TEMP\fast-gate.json"
      - name: No tracked file changed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RDY_CI_ROOT 'work'
          git -c "safe.directory=$($work -replace '\\', '/')" -C $work diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Toolchain
        shell: pwsh
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: Default toolchain
        shell: pwsh
        run: rustup default 1.99.0
      - name: Build from git archive, package and inspect
        shell: pwsh
        run: >-
          python -B scripts/release/candidate.py build --repo $env:GITHUB_WORKSPACE --commit $env:COMMIT
          --version $env:VERSION --target x86_64-pc-windows-msvc --work "$env:RUNNER_TEMP\rdy-candidate"
          --fast-gate "$env:RUNNER_TEMP\fast-gate.json" --run-id $env:GITHUB_RUN_ID
          --run-attempt $env:GITHUB_RUN_ATTEMPT --out "$env:RUNNER_TEMP\candidate-out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: rdy-candidate-x86_64-pc-windows-msvc-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
  assemble:
    name: Candidate manifest
    needs: [check, build-mac, build-windows, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      COMMIT: ${{ needs.check.outputs.commit }}
      VERSION: ${{ needs.check.outputs.version }}
      MAC_ID: ${{ needs.build-mac.outputs.artifact_id }}
      MAC_DIGEST: ${{ needs.build-mac.outputs.artifact_digest }}
      WINDOWS_ID: ${{ needs.build-windows.outputs.artifact_id }}
      WINDOWS_DIGEST: ${{ needs.build-windows.outputs.artifact_digest }}
      LINUX_ID: ${{ needs.build-linux.outputs.artifact_id }}
      LINUX_DIGEST: ${{ needs.build-linux.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      # Each build is fetched by its artifact id as the uploaded ZIP; the script checks the
      # artifact digest itself, then every file digest against the build receipt.
      - name: Download the aarch64-apple-darwin build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-mac.outputs.artifact_id }}
          path: ${{ runner.temp }}/in/aarch64-apple-darwin
          skip-decompress: true
          digest-mismatch: error
      - name: Download the x86_64-pc-windows-msvc build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-windows.outputs.artifact_id }}
          path: ${{ runner.temp }}/in/x86_64-pc-windows-msvc
          skip-decompress: true
          digest-mismatch: error
      - name: Download the x86_64-unknown-linux-gnu build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-linux.outputs.artifact_id }}
          path: ${{ runner.temp }}/in/x86_64-unknown-linux-gnu
          skip-decompress: true
          digest-mismatch: error
      - name: Rehash and write SHA256SUMS over exactly the three archives and the frozen sample, if any
        run: >-
          python3 -B scripts/release/candidate.py assemble --version "$VERSION" --commit "$COMMIT"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --input "aarch64-apple-darwin=$RUNNER_TEMP/in/aarch64-apple-darwin,$MAC_ID,$MAC_DIGEST"
          --input "x86_64-pc-windows-msvc=$RUNNER_TEMP/in/x86_64-pc-windows-msvc,$WINDOWS_ID,$WINDOWS_DIGEST"
          --input "x86_64-unknown-linux-gnu=$RUNNER_TEMP/in/x86_64-unknown-linux-gnu,$LINUX_ID,$LINUX_DIGEST"
          --source "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: rdy-candidate-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Candidate address
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          {
            echo '## Candidate'
            echo "v$VERSION at $COMMIT: run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT,"
            echo "artifact rdy-candidate-a$GITHUB_RUN_ATTEMPT id $ARTIFACT_ID digest $ARTIFACT_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
  sign:
    # The one signature. This job builds nothing: it signs the SHA256SUMS that the assembly job wrote.
    # Its OIDC token (environment release-sign-ci, a candidate/v* tag) is the only way to the release
    # key in AWS KMS. The result is checked with ssh-keygen against the release key before upload.
    name: Sign SHA256SUMS
    needs: [check, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-sign-ci
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - name: Download the candidate
        # By the assembly job's artifact id: a re-run of only this job keeps the first attempt's candidate.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
          digest-mismatch: error
      - name: OIDC token for AWS
        run: |
          curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -I -c 'import json,sys; print(json.load(sys.stdin)["value"], end="")' > "$RUNNER_TEMP/oidc-token"
      - name: Sign with the release key in AWS KMS
        env:
          AWS_ROLE_ARN: arn:aws:iam::682024900233:role/RdyCoreCiSigner
          AWS_ROLE_SESSION_NAME: rdy-core-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          AWS_WEB_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/oidc-token
          AWS_REGION: us-east-2
        run: python3 -I -B scripts/release/kms_sshsig.py "$RUNNER_TEMP/candidate/SHA256SUMS" "$RUNNER_TEMP/out/SHA256SUMS.sig"
      - name: Verify with ssh-keygen against the release key
        run: |
          python3 -I -B -c 'import sys; sys.path.insert(0, "scripts/release"); import kms_sshsig; print(kms_sshsig.ALLOWED_SIGNERS)' > "$RUNNER_TEMP/allowed_signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I rdy-release -n rdy-release-v1 \
            -s "$RUNNER_TEMP/out/SHA256SUMS.sig" < "$RUNNER_TEMP/candidate/SHA256SUMS"
      - name: Remove the token
        if: always()
        run: rm -f "$RUNNER_TEMP/oidc-token"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rdy-candidate-signature-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/SHA256SUMS.sig
          if-no-files-found: error
          retention-days: 90
