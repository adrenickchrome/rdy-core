      - name: Test parser
        # The gate's Python CI tests need PyYAML; hosted macOS images no longer ship it.
        # Hash-pinned and test-only, in a fresh environment first on PATH. It runs before the checkout of the
        # candidate commit, so no checked-out file takes part: the requirement below is a copy of
        # tests/ci/requirements-release-producers.txt, and tests/ci/test_release_workflows.py fails when
        # the two differ.
        run: |
