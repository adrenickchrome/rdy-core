# Build one immutable Release 1 candidate from refs/tags/candidate/v<V> at commit S. Each native job
# (macOS arm64, Windows amd64, Linux amd64) runs the fast gate, builds from `git archive S` in a new
# workspace with path remaps, packages with qa-release-package and refuses a binary that holds a host
# path. The assembly job downloads each build by artifact id, checks its artifact digest, rehashes
# every file, reads the frozen sample from S when samples/tally/ exists (it is optional for now) and writes
# SHA256SUMS over exactly the three archives and that sample. The sign job then signs that SHA256SUMS once
# with the release key in AWS KMS through OIDC (environment release-sign-ci). Nothing here needs a secret or
# writes to the repository. A reserved or released version never builds again.
name: release-candidate
on:
  push:
    tags: ["candidate/v*"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: rdy-core-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Candidate source and version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Candidate ref, main ancestry, Cargo version and target policy
        id: check
        env:
          CANDIDATE_REF: ${{ github.ref }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: >-
          python3 -B scripts/release/candidate.py check-ref --repo "$GITHUB_WORKSPACE"
          --ref "$CANDIDATE_REF" --sha "$CANDIDATE_SHA" --main refs/remotes/origin/main
          --github-output "$GITHUB_OUTPUT"
  build-mac:
    name: Native candidate (aarch64-apple-darwin)
    needs: check
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      COMMIT: ${{ needs.check.outputs.commit }}
      VERSION: ${{ needs.check.outputs.version }}
