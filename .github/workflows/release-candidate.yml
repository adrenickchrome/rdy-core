name: Core release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Unused plain preview version already present at main (0.N.0)
        type: string
        required: true
      factory_qualification_base64:
        description: Base64 of sanitized exact-source deep/performance factory receipt (see docs/releasing.md)
        type: string
        required: true
permissions: {}
concurrency:
  group: core-release-candidate
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  admission:
    if: github.repository == 'adrenickchrome/rdy-core' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Admit exact main source and external factory evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          FACTORY_QUALIFICATION_BASE64: ${{ inputs.factory_qualification_base64 }}
        run: python3 scripts/release/control.py start --version "$VERSION" --directory "$RUNNER_TEMP/admission.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admission
          path: ${{ runner.temp }}/admission.json
          if-no-files-found: error
          retention-days: 7
  native:
    needs: admission
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Fresh native gate and package; no release credentials or PR cache
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: bash scripts/release/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/native/*
          if-no-files-found: error
          retention-days: 7
  assemble:
    needs: [admission, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          merge-multiple: true
          path: ${{ runner.temp }}/packet
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: admission
          path: ${{ runner.temp }}/packet
      - name: Assemble exact signing packet without executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/release/control.py assemble --version "$VERSION" --directory "$RUNNER_TEMP/packet"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate
          path: ${{ runner.temp }}/packet/*
          if-no-files-found: error
          retention-days: 7
  provenance:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # No source checkout, candidate execution, or build scripts in this job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate
          path: ${{ runner.temp }}/packet
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        id: attest
        with:
          subject-path: ${{ runner.temp }}/packet/*
      - name: Retain public attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir "$RUNNER_TEMP/provenance"
          cp -- "$BUNDLE" "$RUNNER_TEMP/provenance/provenance.sigstore.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provenance
          path: ${{ runner.temp }}/provenance/provenance.sigstore.json
          if-no-files-found: error
          retention-days: 7
