# Build one immutable Release 1 candidate from refs/tags/candidate/v<V> at commit S. The check job finds the
# gate.yml run that passed on a push of S to rel/<V>. Each native job (macOS arm64, Windows amd64, Linux amd64)
# runs no test: it downloads that run's fast-gate counts for its target, builds from `git archive S` in a new
# workspace with path remaps, packages with qa-release-package and refuses a binary that holds a host
# path. The assembly job downloads each build by artifact id, checks its artifact digest, rehashes
# every file, reads the frozen sample from S when samples/tally/ exists (it is optional for now) and writes
# SHA256SUMS over exactly the three archives and that sample. The budget job adds up this release's gate time
# against release/gate-budget.json: over the target it opens an issue and the release goes on; over the ceiling
# it refuses the release. The sign job then signs that SHA256SUMS once
# with the release key in AWS KMS through OIDC (environment release-sign-ci). Nothing here needs a secret or
# writes code or a ref to the repository; only the budget job may open an issue. A reserved or released
# version never builds again.
name: release-candidate
on:
  push:
    tags: ["candidate/v*"]
permissions: {}
concurrency:
  group: rdy-core-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Candidate source and version
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
      gate_run_id: ${{ steps.gate.outputs.gate_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Candidate ref, main ancestry, Cargo version and target policy
        id: check
        env:
          CANDIDATE_REF: ${{ github.ref }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: >-
          python3 -B scripts/release/candidate.py check-ref --repo "$GITHUB_WORKSPACE"
          --ref "$CANDIDATE_REF" --sha "$CANDIDATE_SHA" --main refs/remotes/origin/main
          --github-output "$GITHUB_OUTPUT"
      - name: A gate run passed at S
        # The newest gate.yml run that passed on a push of S to rel/<V>. No candidate builds without one.
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          COMMIT: ${{ steps.check.outputs.commit }}
        run: >-
          python3 -B scripts/release/gate_budget.py gate-run --version "$VERSION" --commit "$COMMIT"
          --github-output "$GITHUB_OUTPUT"
  build-mac:
    name: Native candidate (aarch64-apple-darwin)
    needs: check
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      COMMIT: ${{ needs.check.outputs.commit }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Candidate is still unreserved
        # Again here: a re-run of a failed build job does not re-run the check job.
        env:
          CANDIDATE_REF: ${{ github.ref }}
        run: >-
          python3 -B scripts/release/candidate.py check-ref --repo "$GITHUB_WORKSPACE"
          --ref "$CANDIDATE_REF" --sha "$COMMIT" --main refs/remotes/origin/main
      - name: Toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Not root
        run: test "$(id -u)" -ne 0
      - name: Locked dependencies
        run: cargo fetch --locked
      - name: Fast gate counts of the gate run at S
        # The counts that gate.yml's aarch64-apple-darwin job wrote after its gate passed on S. This job runs no test.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fast-gate-aarch64-apple-darwin
          run-id: ${{ needs.check.outputs.gate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gate
          digest-mismatch: error
      - name: Build from git archive, package and inspect
        run: >-
          python3 -B scripts/release/candidate.py build --repo "$GITHUB_WORKSPACE" --commit "$COMMIT"
          --version "$VERSION" --target aarch64-apple-darwin --work "$RUNNER_TEMP/rdy-candidate"
          --fast-gate "$RUNNER_TEMP/gate/fast-gate.json" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --out "$RUNNER_TEMP/candidate-out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: rdy-candidate-aarch64-apple-darwin-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
  build-linux:
    name: Native candidate (x86_64-unknown-linux-gnu)
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      COMMIT: ${{ needs.check.outputs.commit }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Candidate is still unreserved
        # Again here: a re-run of a failed build job does not re-run the check job.
        env:
          CANDIDATE_REF: ${{ github.ref }}
        run: >-
          python3 -B scripts/release/candidate.py check-ref --repo "$GITHUB_WORKSPACE"
          --ref "$CANDIDATE_REF" --sha "$COMMIT" --main refs/remotes/origin/main
      - name: Toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Not root
        run: test "$(id -u)" -ne 0
      - name: Baseline x86-64 emulator
        # The build step below runs the packaged Linux binary under qemu-x86_64 with a CPU model that has
        # no SSE3, CX16 or LAHF-LM. There is no skip: a missing emulator refuses the candidate.
        # The runner's own glibc can be the amd64v3 build, which refuses to load on that CPU model, so qemu
        # loads the C runtime from a sysroot of the plain amd64 libc6 and libgcc-s1 (apt checks their hashes).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          command -v qemu-x86_64
          debs="$RUNNER_TEMP/baseline-debs"
          sysroot="$RUNNER_TEMP/baseline-root"
          mkdir -p "$debs/lists/partial" "$debs/cache/archives/partial" "$sysroot"
          plain=(-o APT::Architecture-Variants= -o Debug::NoLocking=1
                 -o "Dir::State::Lists=$debs/lists" -o "Dir::Cache=$debs/cache")
          apt-get "${plain[@]}" update -qq
          (cd "$debs" && apt-get "${plain[@]}" download libc6 libgcc-s1)
          test "$(ls "$debs"/*.deb | wc -l)" -eq 2
          if ls "$debs"/*.deb | grep -v '_amd64\.deb$'; then echo "not the plain amd64 build" >&2; exit 1; fi
          for deb in "$debs"/*.deb; do dpkg-deb -x "$deb" "$sysroot"; done
          ln -s usr/lib64 "$sysroot/lib64"
          ln -s usr/lib "$sysroot/lib"
          test -f "$sysroot/lib64/ld-linux-x86-64.so.2"
          echo "RELEASE_BASELINE_SYSROOT=$sysroot" >> "$GITHUB_ENV"
      - name: Locked dependencies
        run: cargo fetch --locked
      - name: Fast gate counts of the gate run at S
        # The counts that gate.yml's x86_64-unknown-linux-gnu job wrote after its gate passed on S. This job runs no test.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fast-gate-x86_64-unknown-linux-gnu
          run-id: ${{ needs.check.outputs.gate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gate
          digest-mismatch: error
      - name: Build from git archive, package and inspect
        run: >-
          python3 -B scripts/release/candidate.py build --repo "$GITHUB_WORKSPACE" --commit "$COMMIT"
          --version "$VERSION" --target x86_64-unknown-linux-gnu --work "$RUNNER_TEMP/rdy-candidate"
          --fast-gate "$RUNNER_TEMP/gate/fast-gate.json" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --out "$RUNNER_TEMP/candidate-out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: rdy-candidate-x86_64-unknown-linux-gnu-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
  build-windows:
    name: Native candidate (x86_64-pc-windows-msvc)
    needs: check
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      COMMIT: ${{ needs.check.outputs.commit }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Candidate is still unreserved
        # Again here: a re-run of a failed build job does not re-run the check job.
        shell: pwsh
        env:
          CANDIDATE_REF: ${{ github.ref }}
        run: >-
          python -B scripts/release/candidate.py check-ref --repo $env:GITHUB_WORKSPACE
          --ref $env:CANDIDATE_REF --sha $env:COMMIT --main refs/remotes/origin/main
      - name: Toolchain
        shell: pwsh
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Default toolchain
        shell: pwsh
        run: rustup default 1.99.0
      - name: Fast gate counts of the gate run at S
        # The counts that gate.yml's x86_64-pc-windows-msvc job wrote after its gate passed on S. This job runs no test.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fast-gate-x86_64-pc-windows-msvc
          run-id: ${{ needs.check.outputs.gate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gate
          digest-mismatch: error
      - name: Build from git archive, package and inspect
        shell: pwsh
        run: >-
          python -B scripts/release/candidate.py build --repo $env:GITHUB_WORKSPACE --commit $env:COMMIT
          --version $env:VERSION --target x86_64-pc-windows-msvc --work "$env:RUNNER_TEMP\rdy-candidate"
          --fast-gate "$env:RUNNER_TEMP\gate\fast-gate.json" --run-id $env:GITHUB_RUN_ID
          --run-attempt $env:GITHUB_RUN_ATTEMPT --out "$env:RUNNER_TEMP\candidate-out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: rdy-candidate-x86_64-pc-windows-msvc-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
  assemble:
    name: Candidate manifest
    needs: [check, build-mac, build-windows, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      COMMIT: ${{ needs.check.outputs.commit }}
      VERSION: ${{ needs.check.outputs.version }}
      MAC_ID: ${{ needs.build-mac.outputs.artifact_id }}
      MAC_DIGEST: ${{ needs.build-mac.outputs.artifact_digest }}
      WINDOWS_ID: ${{ needs.build-windows.outputs.artifact_id }}
      WINDOWS_DIGEST: ${{ needs.build-windows.outputs.artifact_digest }}
      LINUX_ID: ${{ needs.build-linux.outputs.artifact_id }}
      LINUX_DIGEST: ${{ needs.build-linux.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      # Each build is fetched by its artifact id as the uploaded ZIP; the script checks the
      # artifact digest itself, then every file digest against the build receipt.
      - name: Download the aarch64-apple-darwin build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-mac.outputs.artifact_id }}
          path: ${{ runner.temp }}/in/aarch64-apple-darwin
          skip-decompress: true
          digest-mismatch: error
      - name: Download the x86_64-pc-windows-msvc build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-windows.outputs.artifact_id }}
          path: ${{ runner.temp }}/in/x86_64-pc-windows-msvc
          skip-decompress: true
          digest-mismatch: error
      - name: Download the x86_64-unknown-linux-gnu build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-linux.outputs.artifact_id }}
          path: ${{ runner.temp }}/in/x86_64-unknown-linux-gnu
          skip-decompress: true
          digest-mismatch: error
      - name: Rehash and write SHA256SUMS over exactly the three archives and the frozen sample, if any
        run: >-
          python3 -B scripts/release/candidate.py assemble --version "$VERSION" --commit "$COMMIT"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --input "aarch64-apple-darwin=$RUNNER_TEMP/in/aarch64-apple-darwin,$MAC_ID,$MAC_DIGEST"
          --input "x86_64-pc-windows-msvc=$RUNNER_TEMP/in/x86_64-pc-windows-msvc,$WINDOWS_ID,$WINDOWS_DIGEST"
          --input "x86_64-unknown-linux-gnu=$RUNNER_TEMP/in/x86_64-unknown-linux-gnu,$LINUX_ID,$LINUX_DIGEST"
          --source "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: rdy-candidate-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Candidate address
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          {
            echo '## Candidate'
            echo "v$VERSION at $COMMIT: run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT,"
            echo "artifact rdy-candidate-a$GITHUB_RUN_ATTEMPT id $ARTIFACT_ID digest $ARTIFACT_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
  budget:
    # The release's gate time (release/gate-budget.json): every gate.yml and security.yml run on rel/<V> and
    # every run of this workflow on candidate/v<V>, every attempt: the time their jobs ran, as GitHub timed
    # them (time spent waiting for a runner is shown, not counted), plus the signing and install-check lines.
    # At or under the target (1,800 s) it passes. Over the target and at or under the ceiling (2,700 s) it
    # passes and opens a gate-time-over-target issue: the release goes on, and the slow step is fixed after
    # it. Over the ceiling, or when the file, the control test and the repository variables
    # RDY_GATE_TARGET_SECONDS and RDY_GATE_CEILING_SECONDS differ, it fails and opens the breach issue for the
    # founder; sign needs it, so nothing is signed. It holds no key and no OIDC token.
    name: Release gate budget
    needs: [check, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - name: Gate time against the target and the ceiling
        id: budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SECONDS: ${{ vars.RDY_GATE_TARGET_SECONDS }}
          CEILING_SECONDS: ${{ vars.RDY_GATE_CEILING_SECONDS }}
          BUDGET_OVERRIDE: ${{ vars.RDY_GATE_BUDGET_OVERRIDE }}
        run: >-
          python3 -B scripts/release/gate_budget.py check --version "$VERSION" --repo "$GITHUB_REPOSITORY"
          --budget-file release/gate-budget.json --target-variable "$TARGET_SECONDS"
          --ceiling-variable "$CEILING_SECONDS" --override "$BUDGET_OVERRIDE"
          --out "$RUNNER_TEMP/gate-budget/gate-budget.json" --summary "$GITHUB_STEP_SUMMARY"
          --issue-body "$RUNNER_TEMP/gate-budget-issue.md" --target-issue-body "$RUNNER_TEMP/gate-target-issue.md"
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: gate-budget-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-budget/gate-budget.json
          if-no-files-found: warn
          retention-days: 90
      - name: Open the over-target issue
        # The release goes on; the slow step is fixed after it. A failed issue call is a warning on the run
        # page and does not stop the release.
        if: steps.budget.outputs.state == 'over_target'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/gate-target-issue.md"
          echo "Run: $RUN_URL" >> "$body"
          if ! { gh label create gate-time-over-target --repo "$GITHUB_REPOSITORY" --color FBCA04 \
                   --description "A release gate took longer than its target" --force \
                 && gh issue create --repo "$GITHUB_REPOSITORY" --label gate-time-over-target \
                   --title "Gate time over target: v$VERSION" --body-file "$body"; }; then
            echo "::warning::The gate-time-over-target issue for v$VERSION was not opened"
          fi
      - name: Open the breach issue for the founder
        # Only the founder closes it; the driver starts no plan while one is open.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/gate-budget-issue.md"
          if [ ! -s "$body" ]; then echo "The budget job of v$VERSION failed before it wrote its table." > "$body"; fi
          echo "Run: $RUN_URL" >> "$body"
          gh label create gate-budget-breach --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "A release went over its gate ceiling" --force
          gh issue create --repo "$GITHUB_REPOSITORY" --label gate-budget-breach \
            --title "E_GATE_BUDGET: v$VERSION is over its gate ceiling" --body-file "$body"
  sign:
    # The one signature. This job builds nothing: it signs the SHA256SUMS that the assembly job wrote.
    # Its OIDC token (environment release-sign-ci, a candidate/v* tag) is the only way to the release
    # key in AWS KMS. The result is checked with ssh-keygen against the release key before upload.
    name: Sign SHA256SUMS
    needs: [check, assemble, budget]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    environment: release-sign-ci
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - name: Download the candidate
        # By the assembly job's artifact id: a re-run of only this job keeps the first attempt's candidate.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
          digest-mismatch: error
      - name: OIDC token for AWS
        run: |
          curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -I -c 'import json,sys; print(json.load(sys.stdin)["value"], end="")' > "$RUNNER_TEMP/oidc-token"
      - name: Sign with the release key in AWS KMS
        env:
          AWS_ROLE_ARN: arn:aws:iam::682024900233:role/RdyCoreCiSigner
          AWS_ROLE_SESSION_NAME: rdy-core-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          AWS_WEB_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/oidc-token
          AWS_REGION: us-east-2
        run: python3 -I -B scripts/release/kms_sshsig.py "$RUNNER_TEMP/candidate/SHA256SUMS" "$RUNNER_TEMP/out/SHA256SUMS.sig"
      - name: Verify with ssh-keygen against the release key
        run: |
          python3 -I -B -c 'import sys; sys.path.insert(0, "scripts/release"); import kms_sshsig; print(kms_sshsig.ALLOWED_SIGNERS)' > "$RUNNER_TEMP/allowed_signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I rdy-release -n rdy-release-v1 \
            -s "$RUNNER_TEMP/out/SHA256SUMS.sig" < "$RUNNER_TEMP/candidate/SHA256SUMS"
      - name: Remove the token
        if: always()
        run: rm -f "$RUNNER_TEMP/oidc-token"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rdy-candidate-signature-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/SHA256SUMS.sig
          if-no-files-found: error
          retention-days: 90
