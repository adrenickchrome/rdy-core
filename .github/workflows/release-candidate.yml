          "$RUNNER_TEMP/ci-tests/bin/python" -m pip install --require-hashes -r "$RUNNER_TEMP/ci-tests-requirements.txt"
          echo "$RUNNER_TEMP/ci-tests/bin" >> "$GITHUB_PATH"
