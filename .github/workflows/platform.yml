name: platforms
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native fast (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            label: macOS ARM64
          - runner: ubuntu-26.04-arm
            label: Linux ARM64 source QA
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.4"
      - name: Toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: Native fast gate, without performance or rebaseline
        id: fast-gate
        run: python3 scripts/ci/run_fast.py
      - name: Retain sanitized fast-gate evidence
        if: always() && steps.fast-gate.outputs.report_ready == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fast-gate-${{ matrix.runner }}-${{ github.run_attempt }}
          path: target/qa/ci-fast-report.json
          if-no-files-found: error
          retention-days: 7
  windows-portable:
    name: Windows Server portable crates only
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Check model, schema and graph only
        # This does not build CLI/store/daemon or qualify Windows11 distribution.
        run: cargo +1.99.0 check --locked -p rdy-model -p rdy-schema -p rdy-graph
  required:
    name: Core platforms
    if: always()
    needs: [native, windows-portable]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All declared platform jobs must succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert set(results) == {'native', 'windows-portable'}
          assert all(value['result'] == 'success' for value in results.values()), results
          PY
