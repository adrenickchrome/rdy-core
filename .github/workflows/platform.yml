# Hosted platform runs. Advisory only: every job may fail without failing the workflow, and none is a
# required check.
name: platforms
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native fast gate, advisory (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            label: macOS ARM64
          - runner: ubuntu-26.04-arm
            label: Linux ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: Not root
        run: test "$(id -u)" -ne 0
      - name: Locked dependencies
        run: cargo fetch --locked
      - name: Fast gate (fmt, clippy, tests; no perf)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo qa --skip-perf --require-all
      - name: Failing tests
        if: failure()
        run: |
          # print the qa report's failing tests and their panic excerpts, so the log names the cause
          test -f target/qa/report.md || exit 0
          sed -n '/^Failing in/,/^## Perf/p' target/qa/report.md
      - name: No tracked file changed
        run: git diff --exit-code
  windows-portable:
    name: Windows Server portable crates, advisory
    runs-on: windows-2025
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Check model, schema and graph only
        # Windows Server is not Windows 11. This does not build the CLI, store or daemon, and it does
        # not qualify a Windows 11 distribution.
        run: cargo +1.99.0 check --locked -p rdy-model -p rdy-schema -p rdy-graph
