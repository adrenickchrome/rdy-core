# Cheap checks (FW-HD2): fmt, clippy and the fast suite on every PR and push. Coverage, the deep and perf gates and
# the hosted-OS runs are in the nightly workflow; the release gate is gate.yml.
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: Fast gate (Linux x86-64)
    runs-on: ubuntu-26.04
    # the suite outgrew 60 minutes at 0cb13504 (rules from chat) and Windows added more
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # The same disk settings as the coverage job: no debug info, and the preinstalled
      # toolchains we never use are removed first.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: Not root
        run: test "$(id -u)" -ne 0
      - name: Locked dependencies
        run: cargo fetch --locked
      - name: Fast gate (fmt, clippy, tests; no perf)
        # Offline after the locked fetch: the gate builds only what Cargo.lock names.
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo qa --skip-perf --require-all
      - name: Failing tests
        if: failure()
        run: |
          # print the qa report's failing tests and their panic excerpts, so the log names the cause
          test -f target/qa/report.md || exit 0
          sed -n '/^Failing in/,/^## Perf/p' target/qa/report.md
      - name: Test selection (shadow)
        # Reported only (FW-HD2): which crates and rdy-qa areas this diff would select, and which of the
        # full suite's failures that selection would have missed. It reads the report the fast gate just
        # wrote and runs no test. It cannot fail the job, and the full suite stays the gate.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CARGO_NET_OFFLINE: "true"
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/ci/select_tests.py --base "$BASE_SHA" --report target/qa/report.json --out selection-shadow.json
          { echo '## Test selection (shadow)'; echo '```'; cat selection-shadow.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        with:
          name: selection-shadow
          path: selection-shadow.json
          if-no-files-found: ignore
          retention-days: 30
      - name: No tracked file changed
        run: git diff --exit-code
  policy-tests:
    name: CI control tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Test parser
        # The workflow tests parse YAML with PyYAML, hash-pinned and test-only, in a fresh environment.
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-tests"
          "$RUNNER_TEMP/ci-tests/bin/python" -m pip install --require-hashes -r tests/ci/requirements-release-producers.txt
      - name: CI control tests
        run: |
          . "$RUNNER_TEMP/ci-tests/bin/activate"
          python3 -m unittest discover -s tests/ci -v
  required:
    # One result for the fast gate and the control tests together. It is not a required check.
    name: Core CI
    if: always()
    needs: [fast, policy-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All results must succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert set(results) == {'fast', 'policy-tests'}
          assert all(value['result'] == 'success' for value in results.values()), results
          PY
