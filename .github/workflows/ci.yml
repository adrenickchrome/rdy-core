# Fast correctness and advisory coverage. External deep/perf and merge authority remain separate.
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: Fast correctness (Linux x86-64)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      # The same disk settings as the coverage job: no debug info, and the preinstalled
      # toolchains we never use are removed first.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.4"
      - name: Toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: Not root
        run: test "$(id -u)" -ne 0
      - name: Fast gate (fmt, clippy, tests; no perf)
        id: fast-gate
        run: python3 scripts/ci/run_fast.py
      - name: Retain sanitized fast-gate evidence
        if: always() && steps.fast-gate.outputs.report_ready == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fast-gate-linux-x86_64-${{ github.run_attempt }}
          path: target/qa/ci-fast-report.json
          if-no-files-found: error
          retention-days: 7
  coverage:
    permissions:
      contents: read
    # Line and branch coverage of the workspace test suite (cargo-llvm-cov). Reported only:
    # it never blocks a merge. The summary goes to the run page; the HTML report is an artifact.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    env:
      # The instrumented build and its raw profiles fill the runner's disk: no debug info (coverage maps
      # do not need it), and the preinstalled toolchains we never use are removed first.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.4"
      - name: Toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component llvm-tools-preview
      - name: Pinned coverage tool
        run: |
          python3 scripts/ci/install_tools.py --out "$RUNNER_TEMP/coverage-tools" cargo-llvm-cov
          echo "$RUNNER_TEMP/coverage-tools" >> "$GITHUB_PATH"
      - name: Locked dependencies
        run: cargo fetch --locked
      - name: Not root
        run: test "$(id -u)" -ne 0
      - name: Tests with coverage
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo llvm-cov --locked --workspace --no-fail-fast --no-report
          df -h /
      - name: Reports
        if: always()
        run: |
          # The config_edit test hsa2_new_directories_are_0700_or_not_made_at_all runs its own
          # instrumented binary under umasks 477 and 700 on purpose. The profile runtime makes each
          # .profraw 0666 less the umask, so those profiles are whole but 0200 or 0066, and
          # llvm-profdata crashes (SIGILL) on a file it cannot open. Give the owner read back: the
          # data is kept, and any other merge error still fails this step.
          find target/llvm-cov-target -name '*.profraw' ! -perm -u=r -print -exec chmod u+r {} +
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
          cargo llvm-cov report --html --output-dir coverage-html
          cargo llvm-cov report --json --summary-only --output-path coverage-summary.json
          { echo '## Coverage'; echo '```'; cat coverage-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: coverage
          path: |
            coverage-html
            coverage-summary.txt
            coverage-summary.json
          retention-days: 7
  policy-tests:
    name: CI control tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: CI, release and installer controls
        run: |
          python3 -m unittest discover -s tests/ci -v
          python3 -m unittest discover -s tests/release -v
          python3 -m unittest discover -s tests/installer -v
  required:
    name: Core CI
    if: always()
    needs: [fast, policy-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required results must succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert set(results) == {'fast', 'policy-tests'}
          assert all(value['result'] == 'success' for value in results.values()), results
          PY
