# The CI control tests on every PR and push to main. The test suite runs in gate.yml (the release gate on a push of
# S to rel/<V>, on our machines) and in the nightly workflow (the whole suite, the deep and perf gates, the hosted
# OS images and coverage).
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  policy-tests:
    name: CI control tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Test parser
        # The workflow tests parse YAML with PyYAML, hash-pinned and test-only, in a fresh environment.
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-tests"
          "$RUNNER_TEMP/ci-tests/bin/python" -m pip install --require-hashes -r tests/ci/requirements-release-producers.txt
      - name: CI control tests
        run: |
          . "$RUNNER_TEMP/ci-tests/bin/activate"
          python3 -m unittest discover -s tests/ci -v
  required:
    # One result for the control tests. It is not a required check. The release evidence reads it at S.
    name: Core CI
    if: always()
    needs: [policy-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All results must succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert set(results) == {'policy-tests'}
          assert all(value['result'] == 'success' for value in results.values()), results
          PY
