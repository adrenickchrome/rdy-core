<text x="308" y="250" fill="#E5E7EC" font-size="14" font-weight="500" text-anchor="start">Storage</text>
<text x="572" y="250" fill="#B4CAFF" font-size="12" font-weight="500" text-anchor="end">Updated</text>
<rect x="308" y="259.5" width="264" height="1" fill="#272B35"/>
<text x="308" y="278" fill="#E5E7EC" font-size="14" font-weight="500" text-anchor="start">Privacy page</text>
<text x="572" y="278" fill="#B4CAFF" font-size="12" font-weight="500" text-anchor="end">Updated</text>
<rect x="308" y="287.5" width="264" height="1" fill="#272B35"/>
<text x="308" y="306" fill="#E5E7EC" font-size="14" font-weight="500" text-anchor="start">Backups</text>
<text x="572" y="306" fill="#B4CAFF" font-size="12" font-weight="500" text-anchor="end">Updated</text>
<rect x="308" y="315.5" width="264" height="1" fill="#272B35"/>
<text x="308" y="334" fill="#E5E7EC" font-size="14" font-weight="500" text-anchor="start">Analytics</text>
<text x="572" y="334" fill="#86D49A" font-size="12" font-weight="500" text-anchor="end">Upheld</text>
<rect x="308" y="343.5" width="264" height="1" fill="#272B35"/>
<text x="308" y="362" fill="#E5E7EC" font-size="14" font-weight="500" text-anchor="start">Legal hold</text>
<text x="572" y="362" fill="#86D49A" font-size="12" font-weight="500" text-anchor="end">Upheld</text>
<text x="308" y="397" fill="#A1A7B4" font-size="12" font-weight="400" text-anchor="start">Separate EU backups: 7 days</text>
<text x="636" y="153" fill="#A1A7B4" font-size="11" font-weight="600" text-anchor="start" letter-spacing="0.6">PROPOSAL 1@1</text>
<circle cx="646" cy="188" r="10" fill="#1D3025"/>
<polygon points="639.92,188.0 641.84,186.08 644.72,189.28 650.16,182.88 652.4,184.8 644.72,193.76" fill="#86D49A"/>
<text x="665" y="184" fill="#E5E7EC" font-size="14" font-weight="500" text-anchor="start">EU retention change</text>
<text x="665" y="204" fill="#86D49A" font-size="14" font-weight="500" text-anchor="start">confirmed</text>
<rect x="636" y="235" width="200" height="48" rx="8" fill="#8FB0FF"/>
<rect x="637" y="236" width="198" height="46" rx="7" fill="#8FB0FF"/>
<polygon points="649.92,258.0 651.84,256.08 654.72,259.28 660.16,252.88 662.4,254.8 654.72,263.76" fill="#121419"/>
<text x="675" y="264" fill="#121419" font-size="13.2" font-weight="600" text-anchor="start">Approve Proposal 1@1</text>
<rect x="735.4" y="296" width="1.2" height="18" fill="#3A404C"/>
<rect x="636" y="326" width="200" height="44" rx="9" fill="#1D3025"/>
<polygon points="651.92,348.0 653.84,346.08 656.72,349.28 662.16,342.88 664.4,344.8 656.72,353.76" fill="#86D49A"/>
<text x="676" y="353" fill="#86D49A" font-size="15" font-weight="600" text-anchor="start">Accepted record</text>
<text x="636" y="397" fill="#A1A7B4" font-size="12" font-weight="400" text-anchor="start">Your answer · This version</text>
<text x="28" y="442" fill="#8F96A3" font-size="11" font-weight="400" text-anchor="start">Illustration based on the getrdy.dev retention demo.</text>
</g></svg>
