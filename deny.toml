# Reviewed dependency policy. No advisory ignores. MPL exceptions name exact crate versions.
[advisories]
version = 2
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "CDLA-Permissive-2.0"
]

[[licenses.exceptions]]
crate = "imbl@7.0.2"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "imbl-sized-chunks@0.2.0"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
# Local workspace path dependencies intentionally omit registry versions.
# Cargo.lock plus locked fetch binds all resolved dependencies; unknown sources remain denied.
# cargo-deny 0.20.2 wildcard checking misresolves inherited local paths.
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
