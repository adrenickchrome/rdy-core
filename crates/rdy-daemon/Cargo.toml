[package]
name = "rdy-daemon"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rdy-engine.workspace = true
rdy-mcp.workspace = true
rdy-render.workspace = true
rdy-model.workspace = true
rdy-store.workspace = true
rmcp.workspace = true
arc-swap.workspace = true
getrandom.workspace = true
subtle.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http = "1"
bytes = "1"
http-body-util = "0.1"

[build-dependencies]
blake3.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
rdy-render = { workspace = true, features = ["probe"] }
tempfile.workspace = true
rdy-schema.workspace = true
blake3.workspace = true
# the signing tests sign with fixed in-memory test keys only
ed25519-dalek.workspace = true
ssh-key.workspace = true

# its own main: the test binary is also the daemon a test starts (`rdy serve --detach ...`), and a
# test harness would refuse those arguments
[[test]]
name = "windows_lifecycle"
harness = false

[lints]
workspace = true
