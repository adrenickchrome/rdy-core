<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 56.67 174.00" style="max-width: 56.67px; background-color: #ffffff; --bg:#ffffff; --fg:#27272a; --line:#939395; --accent:#47474a; --muted:#a9a9aa; --surface:#f9f9f9; --border:#d4d4d4; --cluster-bkg:#f9f9f9; --note-fill:#f9f9f9;" font-family="&quot;trebuchet ms&quot;, verdana, arial, sans-serif" font-size="16.00">
  <style>
    svg {
      --_text: var(--fg);
      --_text-sec: color-mix(in srgb, var(--fg) 60%, var(--bg));
      --_text-muted: var(--muted);
      --_text-faint: color-mix(in srgb, var(--fg) 25%, var(--bg));
      --_line: var(--line);
      --_arrow: var(--accent);
      --_node-fill: var(--surface);
      --_node-stroke: var(--border);
      --_group-fill: var(--bg);
      --_cluster-bkg: var(--cluster-bkg);
      --_note-fill: var(--note-fill);
    }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10.00 10.00" refX="5.00" refY="5.00" markerWidth="8.00" markerHeight="8.00" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10.00 5.00 L 0 10.00 z" fill="#47474a" data-svg-role="graph-marker-fill" style="fill:var(--_arrow);" />
    </marker>
  </defs>
  <g transform="translate(0.00,0.00)">
    <g class="edgePaths">
      <path d="M28.34,62.00 L28.34,108.00" stroke="#939395" stroke-width="1.00" fill="none" stroke-linecap="round" stroke-linejoin="round" data-svg-role="graph-edge-stroke" style="stroke:var(--_line);" marker-end="url(#arrowhead)" />
    </g>
    <g class="nodes">
      <g class="node default e" id="S" data-id="S" data-look="classic">
        <rect x="8.00" y="8.00" width="40.67" height="54.00" rx="5.00" ry="5.00" fill="#f00" onload="alert(1)" stroke="#d4d4d4" stroke-width="1.00" stroke-linejoin="round" data-svg-role="graph-node-shape" style="stroke:var(--_node-stroke);" />
        <text x="28.34" y="35.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="graph-node-text" style="fill:var(--_text);">S</text>
      </g>
      <g class="node default" id="T" data-id="T" data-look="classic">
        <rect x="8.45" y="112.00" width="39.77" height="54.00" rx="5.00" ry="5.00" fill="#f9f9f9" stroke="#d4d4d4" stroke-width="1.00" stroke-linejoin="round" data-svg-role="graph-node-shape" style="fill:var(--_node-fill);stroke:var(--_node-stroke);" />
        <text x="28.34" y="139.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="graph-node-text" style="fill:var(--_text);">T</text>
      </g>
    </g>
    <g class="edgeLabels">
    </g>
  </g>
</svg>
