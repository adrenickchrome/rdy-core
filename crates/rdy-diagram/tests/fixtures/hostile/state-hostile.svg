<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 215.45 278.00" style="max-width: 215.45px; background-color: #ffffff; --bg:#ffffff; --fg:#27272a; --line:#939395; --accent:#47474a; --muted:#a9a9aa; --surface:#f9f9f9; --border:#d4d4d4; --cluster-bkg:#f9f9f9; --note-fill:#f9f9f9;" font-family="&quot;trebuchet ms&quot;, verdana, arial, sans-serif" font-size="16.00">
  <style>
    svg {
      --_text: var(--fg);
      --_text-sec: color-mix(in srgb, var(--fg) 60%, var(--bg));
      --_text-muted: var(--muted);
      --_text-faint: color-mix(in srgb, var(--fg) 25%, var(--bg));
      --_line: var(--line);
      --_arrow: var(--accent);
      --_node-fill: var(--surface);
      --_node-stroke: var(--border);
      --_group-fill: var(--bg);
      --_cluster-bkg: var(--cluster-bkg);
      --_note-fill: var(--note-fill);
    }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10.00 10.00" refX="5.00" refY="5.00" markerWidth="8.00" markerHeight="8.00" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10.00 5.00 L 0 10.00 z" fill="#47474a" data-svg-role="graph-marker-fill" style="fill:var(--_arrow);" />
    </marker>
  </defs>
  <g transform="translate(21.59,0.00)">
    <g class="edgePaths">
      <path d="M86.14,62.00 L86.14,212.00" stroke="#939395" stroke-width="1.00" fill="none" stroke-linecap="round" stroke-linejoin="round" data-svg-role="graph-edge-stroke" style="stroke:var(--_line);" marker-end="url(#arrowhead)" />
    </g>
    <g class="nodes">
      <g class="node default" id="S" data-id="S" data-look="classic">
        <rect x="8.00" y="8.00" width="156.27" height="54.00" rx="5.00" ry="5.00" fill="#f9f9f9" stroke="#d4d4d4" stroke-width="1.00" stroke-linejoin="round" data-svg-role="graph-node-shape" style="fill:var(--_node-fill);stroke:var(--_node-stroke);" />
        <text x="86.14" y="35.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="graph-node-text" style="fill:var(--_text);">&lt;script&gt;x&lt;/script&gt;</text>
      </g>
      <g class="node default" id="T" data-id="T" data-look="classic">
        <rect x="66.25" y="216.00" width="39.77" height="54.00" rx="5.00" ry="5.00" fill="#f9f9f9" stroke="#d4d4d4" stroke-width="1.00" stroke-linejoin="round" data-svg-role="graph-node-shape" style="fill:var(--_node-fill);stroke:var(--_node-stroke);" />
        <text x="86.14" y="243.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="graph-node-text" style="fill:var(--_text);">T</text>
      </g>
    </g>
    <g class="edgeLabels">
      <rect x="-13.59" y="64.00" width="199.45" height="76.00" fill="#ffffff" data-svg-role="graph-edge-label-bg" style="fill:var(--bg);" />
      <text x="86.14" y="78.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="graph-edge-text" style="fill:var(--_text);">&lt;a</text>
      <text x="86.14" y="102.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="graph-edge-text" style="fill:var(--_text);">href=&quot;https://example.com&quot;</text>
      <text x="86.14" y="126.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="graph-edge-text" style="fill:var(--_text);">&gt;x&lt;/a&gt;</text>
    </g>
  </g>
</svg>
