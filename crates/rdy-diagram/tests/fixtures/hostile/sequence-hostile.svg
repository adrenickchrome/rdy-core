<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 384.32 224.00" style="max-width: 384.32px; background-color: #ffffff; --bg:#ffffff; --fg:#27272a; --line:#939395; --accent:#47474a; --muted:#a9a9aa; --surface:#f9f9f9; --border:#d4d4d4; --cluster-bkg:#f9f9f9; --note-fill:#f9f9f9;" font-family="&quot;trebuchet ms&quot;, verdana, arial, sans-serif" font-size="16.00">
  <style>
    svg {
      --_text: var(--fg);
      --_text-sec: color-mix(in srgb, var(--fg) 60%, var(--bg));
      --_text-muted: var(--muted);
      --_text-faint: color-mix(in srgb, var(--fg) 25%, var(--bg));
      --_line: var(--line);
      --_arrow: var(--accent);
      --_node-fill: var(--surface);
      --_node-stroke: var(--border);
      --_group-fill: var(--bg);
      --_cluster-bkg: var(--cluster-bkg);
      --_note-fill: var(--note-fill);
    }
  </style>
  <defs>
    <marker id="seq-arrowhead" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#47474a" data-svg-role="sequence-marker-fill" style="fill:var(--_arrow);" />
    </marker>
  </defs>
  <g class="lifelines">
    <line x1="93.74" y1="54.00" x2="93.74" y2="214.00" stroke="#939395" stroke-width="1" stroke-dasharray="5,5" data-svg-role="sequence-line" style="stroke:var(--_line);" />
    <line x1="353.87" y1="54.00" x2="353.87" y2="214.00" stroke="#939395" stroke-width="1" stroke-dasharray="5,5" data-svg-role="sequence-line" style="stroke:var(--_line);" />
  </g>
  <g class="participants">
    <rect x="10.00" y="10.00" width="167.49" height="44.00" fill="#f9f9f9" stroke="#d4d4d4" stroke-width="1" data-svg-role="sequence-participant-box" style="fill:var(--_node-fill);stroke:var(--_node-stroke);" />
    <text x="93.74" y="32.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="sequence-text" style="fill:var(--_text);">&lt;script&gt;x&lt;/script&gt;</text>
    <rect x="333.41" y="10.00" width="40.91" height="44.00" fill="#f9f9f9" stroke="#d4d4d4" stroke-width="1" data-svg-role="sequence-participant-box" style="fill:var(--_node-fill);stroke:var(--_node-stroke);" />
    <text x="353.87" y="32.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="sequence-text" style="fill:var(--_text);">B</text>
  </g>
  <g class="events">
    <line x1="93.74" y1="74.00" x2="353.87" y2="74.00" stroke="#939395" stroke-width="1" marker-end="url(#seq-arrowhead)" data-svg-role="sequence-line" style="stroke:var(--_line);"/>
    <text x="223.80" y="70.00" text-anchor="middle" dominant-baseline="auto" fill="#27272a" data-svg-role="sequence-text" style="fill:var(--_text);">&lt;img src=x onerror=alert(1)&gt;</text>
    <path d="M 14.98 124.00 L 165.51 124.00 L 172.51 131.00 L 172.51 164.00 L 14.98 164.00 Z" fill="#f9f9f9" stroke="#939395" stroke-width="1" data-svg-role="sequence-note" style="fill:var(--_note-fill);stroke:var(--_line);" />
    <path d="M 165.51 124.00 L 165.51 131.00 L 172.51 131.00" fill="none" stroke="#939395" stroke-width="1" data-svg-role="sequence-line" style="stroke:var(--_line);" />
    <text x="93.74" y="144.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="sequence-text" style="fill:var(--_text);">javascript:alert(1)</text>
  </g>
</svg>
