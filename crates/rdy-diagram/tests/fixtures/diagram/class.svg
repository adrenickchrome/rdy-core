        <rect x="61.82" y="424.00" width="71.55" height="54.00" fill="#f9f9f9" stroke="#d4d4d4" stroke-width="1.00" stroke-linejoin="round" data-svg-role="graph-node-shape" style="fill:var(--_node-fill);stroke:var(--_node-stroke);" />
        <text x="97.60" y="451.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="graph-node-text" style="fill:var(--_text);">C</text>
      </g>
    </g>
    <g class="edgeLabels">
      <rect x="39.34" y="101.00" width="116.52" height="28.00" fill="#ffffff" data-svg-role="graph-edge-label-bg" style="fill:var(--bg);" />
      <text x="97.60" y="115.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="graph-edge-text" style="fill:var(--_text);">uses #91;it#93;</text>
      <rect x="32.22" y="357.00" width="130.75" height="28.00" fill="#ffffff" data-svg-role="graph-edge-label-bg" style="fill:var(--bg);" />
      <text x="97.60" y="371.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="graph-edge-text" style="fill:var(--_text);">second #59; third</text>
