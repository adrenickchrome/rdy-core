<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 195.20 486.00" style="max-width: 195.20px; background-color: #ffffff; --bg:#ffffff; --fg:#27272a; --line:#939395; --accent:#47474a; --muted:#a9a9aa; --surface:#f9f9f9; --border:#d4d4d4; --cluster-bkg:#f9f9f9; --note-fill:#f9f9f9;" font-family="&quot;trebuchet ms&quot;, verdana, arial, sans-serif" font-size="16.00">
  <style>
    svg {
      --_text: var(--fg);
      --_text-sec: color-mix(in srgb, var(--fg) 60%, var(--bg));
      --_text-muted: var(--muted);
      --_text-faint: color-mix(in srgb, var(--fg) 25%, var(--bg));
      --_line: var(--line);
      --_arrow: var(--accent);
      --_node-fill: var(--surface);
      --_node-stroke: var(--border);
      --_group-fill: var(--bg);
      --_cluster-bkg: var(--cluster-bkg);
      --_note-fill: var(--note-fill);
    }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10.00 10.00" refX="5.00" refY="5.00" markerWidth="8.00" markerHeight="8.00" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10.00 5.00 L 0 10.00 z" fill="#47474a" data-svg-role="graph-marker-fill" style="fill:var(--_arrow);" />
    </marker>
  </defs>
  <g transform="translate(0.00,0.00)">
    <g class="edgePaths">
      <path d="M97.60,62.00 L97.60,164.00" stroke="#939395" stroke-width="1.00" fill="none" stroke-linecap="round" stroke-linejoin="round" data-svg-role="graph-edge-stroke" style="stroke:var(--_line);" marker-end="url(#arrowhead)" />
      <path d="M97.60,318.00 L97.60,420.00" stroke="#939395" stroke-width="1.00" fill="none" stroke-linecap="round" stroke-linejoin="round" data-svg-role="graph-edge-stroke" style="stroke:var(--_line);" stroke-dasharray="2.00,4.00" marker-end="url(#arrowhead)" />
    </g>
    <g class="nodes">
      <g class="node default" id="A" data-id="A" data-look="classic">
        <rect x="8.00" y="8.00" width="179.20" height="54.00" fill="#f9f9f9" stroke="#d4d4d4" stroke-width="1.00" stroke-linejoin="round" data-svg-role="graph-node-shape" style="fill:var(--_node-fill);stroke:var(--_node-stroke);" />
        <text x="97.60" y="35.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="graph-node-text" style="fill:var(--_text);">first #40;one#41;</text>
      </g>
      <g class="node default" id="B" data-id="B" data-look="classic">
        <rect x="19.79" y="168.00" width="155.61" height="150.00" fill="#f9f9f9" stroke="#d4d4d4" stroke-width="1.00" stroke-linejoin="round" data-svg-role="graph-node-shape" style="fill:var(--_node-fill);stroke:var(--_node-stroke);" />
        <text x="97.60" y="195.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="graph-node-text" style="fill:var(--_text);">B</text>
        <line x1="19.79" y1="219.00" x2="175.40" y2="219.00" stroke="#d4d4d4" stroke-width="1.00" data-svg-role="graph-node-stroke" style="stroke:var(--_node-stroke);" />
        <text x="34.79" y="243.00" text-anchor="start" dominant-baseline="middle" fill="#27272a" data-svg-role="graph-node-text" style="fill:var(--_text);">+String name</text>
        <line x1="19.79" y1="267.00" x2="175.40" y2="267.00" stroke="#d4d4d4" stroke-width="1.00" data-svg-role="graph-node-stroke" style="stroke:var(--_node-stroke);" />
        <text x="34.79" y="291.00" text-anchor="start" dominant-baseline="middle" fill="#27272a" data-svg-role="graph-node-text" style="fill:var(--_text);">+run(x) bool</text>
      </g>
