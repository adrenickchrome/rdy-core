    <polygon points="439.07,112.00 487.07,112.00 487.07,125.00 478.67,132.00 439.07,132.00" fill="#ffffff" stroke="#d4d4d4" stroke-width="1" data-svg-role="sequence-block-tab" style="fill:var(--_group-fill);stroke:var(--_node-stroke);" />
    <text x="463.07" y="122.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="sequence-text" style="fill:var(--_text);">loop</text>
    <text x="964.78" y="127.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="sequence-text" style="fill:var(--_text);">[second #34;q#34; #35;h #59;s #60;l#62; #91;b#93; #40;p#41; #123;c#125; #124;v #96;t#96; &amp; back\slash it&apos;s café ✓]</text>
  </g>
