    <rect x="1318.20" y="48.00" width="83.23" height="44.00" fill="#f9f9f9" stroke="#d4d4d4" stroke-width="1" data-svg-role="sequence-participant-box" style="fill:var(--_node-fill);stroke:var(--_node-stroke);" />
    <text x="1359.81" y="70.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="sequence-text" style="fill:var(--_text);">second</text>
