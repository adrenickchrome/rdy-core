        <text x="87.50" y="259.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="graph-node-text" style="fill:var(--_text);">second #96;B#96;</text>
      </g>
      <g class="node default" id="__root_end" data-id="__root_end" data-look="classic">
        <circle cx="87.50" cy="350.00" r="14.00" fill="#f9f9f9" stroke="#d4d4d4" stroke-width="1.00" stroke-linejoin="round" data-svg-role="graph-node-shape" style="fill:var(--_node-fill);stroke:var(--_node-stroke);" />
        <circle cx="87.50" cy="350.00" r="9.00" fill="#d4d4d4" stroke="#d4d4d4" stroke-width="1.00" stroke-linejoin="round" />
        <text x="87.50" y="350.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="graph-node-text" style="fill:var(--_text);"></text>
