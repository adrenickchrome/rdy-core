        <rect x="20.91" y="72.00" width="133.17" height="54.00" rx="5.00" ry="5.00" fill="#f9f9f9" stroke="#d4d4d4" stroke-width="1.00" stroke-linejoin="round" data-svg-role="graph-node-shape" style="fill:var(--_node-fill);stroke:var(--_node-stroke);" />
        <text x="87.50" y="99.00" text-anchor="middle" dominant-baseline="middle" fill="#27272a" data-svg-role="graph-node-text" style="fill:var(--_text);">first #40;A#41;</text>
      </g>
