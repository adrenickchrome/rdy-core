<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 174.99 372.00" style="max-width: 174.99px; background-color: #ffffff; --bg:#ffffff; --fg:#27272a; --line:#939395; --accent:#47474a; --muted:#a9a9aa; --surface:#f9f9f9; --border:#d4d4d4; --cluster-bkg:#f9f9f9; --note-fill:#f9f9f9;" font-family="&quot;trebuchet ms&quot;, verdana, arial, sans-serif" font-size="16.00">
  <style>
    svg {
      --_text: var(--fg);
      --_text-sec: color-mix(in srgb, var(--fg) 60%, var(--bg));
      --_text-muted: var(--muted);
      --_text-faint: color-mix(in srgb, var(--fg) 25%, var(--bg));
      --_line: var(--line);
      --_arrow: var(--accent);
      --_node-fill: var(--surface);
      --_node-stroke: var(--border);
      --_group-fill: var(--bg);
      --_cluster-bkg: var(--cluster-bkg);
      --_note-fill: var(--note-fill);
    }
