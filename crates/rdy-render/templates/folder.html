{% extends "layout.html" %}
{% block content %}
<h1>{{ body.folder.title }}</h1>
{% if body.folder.description %}<p>{{ body.folder.description }}</p>{% endif %}
<ul>{% for c in body.folder.children %}<li><a href="{{ c.href }}">{{ c.label }}</a> <span class="meta">{{ c.kind }}</span></li>{% endfor %}</ul>
{% endblock %}
