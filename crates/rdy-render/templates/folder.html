{% extends "layout.html" %}
{% block content %}
<h1>{{ folder.title }}</h1>
{% if folder.description %}<p>{{ folder.description }}</p>{% endif %}
<p class="meta">folder · {{ folder.id }}</p>
<ul>{% for c in children %}<li><a href="{{ c.href|safe }}">{{ c.label }}</a> <span class="meta">{{ c.kind }}</span></li>{% endfor %}</ul>
{% endblock %}
