<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · {{ site_name }}</title>
<script>{{ init_js|safe }}</script>
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="head">
  <a class="brand" href="/"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="var(--accent)"/><path d="M8 7.5v9M16 7.5v9M8 12h8" stroke="var(--bg)" stroke-width="2" stroke-linecap="round"/></svg><span class="brand-name">{{ site_name }}</span></a>
</header>
<main class="content" id="main" tabindex="-1">
<h1>{{ title }}</h1>
<nav class="vmenu" aria-label="{{ title }}">
{% for s in sections %}<section><h2>{{ s.title }}</h2>{% if s.rows %}<ul class="vmenu-list">{% for r in s.rows %}<li><a href="{{ r.href }}">{{ r.label }}</a>{% if r.meta %} <span class="vmenu-meta">{{ r.meta | join(" · ") }}</span>{% endif %}</li>{% endfor %}</ul>{% else %}<p class="vmenu-none">None open.</p>{% endif %}</section>
{% endfor %}</nav>
</main>
</body>
</html>
