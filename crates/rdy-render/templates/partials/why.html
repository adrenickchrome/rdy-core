{% set trail = item.trail %}{% if trail.events or trail.through %}<details class="why"><summary>Why</summary><div class="why-body" data-rdy="trail">{% if trail.events %}<ol class="trail">{% for e in trail.events %}<li{% if e.open %} class="open"{% endif %}><span class="trail-when">{{ e.when }}</span><span class="trail-what">{{ e.text|safe }}</span></li>{% endfor %}</ol>{% endif %}{% if trail.through %}<p class="trail-through">{{ trail.through|safe }}</p>{% endif %}</div></details>{% endif %}
