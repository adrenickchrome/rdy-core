<span class="tools"><button type="button" class="tool copy-link" data-href="{% if item.kind_word != "page" %}#{{ item.anchor }}{% endif %}" aria-label="Copy link to this {{ item.kind_word }}">Link</button>{% if not item.presentational %}<button type="button" class="tool copy-ref" aria-label="Copy a reference to this {{ item.kind_word }} for an agent chat">Copy ref</button>{% endif %}{% if item.copy %}<button type="button" class="tool copy-text" data-copy-start="{{ item.copy.start }}" data-copy-end="{{ item.copy.end }}" aria-label="Copy this {{ item.kind_word }} as Markdown">Copy</button>{% endif %}</span>
