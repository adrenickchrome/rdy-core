<span class="tools"><button type="button" class="tool copy-link" data-href="#{{ item.anchor }}" aria-label="Copy link to this {{ item.kind_word }}">Link</button>{% if not item.presentational %}<button type="button" class="tool copy-ref" aria-label="Copy a reference to this {{ item.kind_word }} for an agent chat">Copy ref</button>{% endif %}</span>
