- id: d-XM01W
  type: doc
  order: a1
  fields:
    title: Pattern matching by example
    doc_type: overview
- id: s-BCHSC
  type: section
  parent: d-XM01W
  order: a1
  fields:
    title: Introduction
- id: p-71MQ4
  type: prose
  parent: s-BCHSC
  order: a1
  body: We will write the command parser for a small text adventure. The player types things like `get
    sword` or `go north`; the game splits the line into words and has to decide what to do. Each section
    adds one feature of pattern matching to the parser.
- id: p-D56RX
  type: prose
  parent: s-BCHSC
  order: a2
  body: The tutorial teaches by example. The exact rules are in {{d-8PBD5}} and the reasons for them in
    {{d-3T4TW}}.
- id: s-DEBV4
  type: section
  parent: d-XM01W
  order: a2
  fields:
    title: Matching sequences
- id: p-VWXDC
  type: prose
  parent: s-DEBV4
  order: a1
  body: Splitting the input gives a list of words. Instead of checking its length by hand, describe the
    shape you expect.
- id: cd-CVKKA
  type: code
  parent: s-DEBV4
  order: a2
  fields:
    lang: python
  body: |-
    match command.split():
        case [action, obj]:
            ...  # interpret action, obj
- id: p-7A4R5
  type: prose
  parent: s-DEBV4
  order: a3
  body: A pattern does two things. It verifies that the subject has a certain structure, here a list of
    exactly two items, and it binds names in the pattern to parts of the subject, here `action` and `obj`.
- id: s-76SVR
  type: section
  parent: d-XM01W
  order: a3
  fields:
    title: Matching several patterns
- id: p-QQFVP
  type: prose
  parent: s-76SVR
  order: a1
  body: Commands come in different lengths. `look` is one word; `get sword` is two.
- id: cd-Z5DG3
  type: code
  parent: s-76SVR
  order: a2
  fields:
    lang: python
  body: |-
    match command.split():
        case [action]:
            ...  # interpret single-verb action
        case [action, obj]:
            ...  # interpret action, obj
- id: p-KA0M5
  type: prose
  parent: s-76SVR
  order: a3
  body: The match statement checks patterns from top to bottom. If a pattern does not match the subject,
    the next one is tried.
- id: s-J4RQD
  type: section
  parent: d-XM01W
  order: a4
  fields:
    title: Matching specific values
- id: p-SGTGY
  type: prose
  parent: s-J4RQD
  order: a1
  body: Literal values in a pattern filter for particular commands.
- id: cd-55F89
  type: code
  parent: s-J4RQD
  order: a2
  fields:
    lang: python
  body: |-
    match command.split():
        case ["quit"]:
            print("Goodbye!")
            quit_game()
        case ["look"]:
            current_room.describe()
        case ["get", obj]:
            character.get(obj, current_room)
        case ["go", direction]:
            current_room = current_room.neighbor(direction)
        # The rest of your commands go here
- id: p-70BHH
  type: prose
  parent: s-J4RQD
  order: a3
  body: Literals are compared with `==`, except for `True`, `False` and `None`, which are compared with
    `is`. The precise rule is in {{s-PZK7F}} and the sections around it.
- id: s-SMQ23
  type: section
  parent: d-XM01W
  order: a5
  fields:
    title: Matching the rest
- id: p-BMR5J
  type: prose
  parent: s-SMQ23
  order: a1
  body: A star inside a sequence pattern works like extended unpacking.
- id: cd-BFVAC
  type: code
  parent: s-SMQ23
  order: a2
  fields:
    lang: python
  body: |-
    match command.split():
        case ["drop", *objects]:
            for obj in objects:
                character.drop(obj, current_room)
        # The rest of your commands go here
- id: p-89AFY
  type: prose
  parent: s-SMQ23
  order: a3
  body: This matches any sequence whose first element is `"drop"`. The remaining elements are gathered
    into a list bound to `objects`. See {{s-H142N}}.
- id: s-F20PN
  type: section
  parent: d-XM01W
  order: a6
  fields:
    title: Adding a wildcard
- id: p-JKB2F
  type: prose
  parent: s-F20PN
  order: a1
  body: To handle anything not yet covered, end with the wildcard.
- id: cd-6N3BZ
  type: code
  parent: s-F20PN
  order: a2
  fields:
    lang: python
  body: |-
    match command.split():
        case ["quit"]: ...  # Code omitted for brevity
        case ["go", direction]: ...
        case ["drop", *objects]: ...
        ...  # Other cases
        case _:
            print(f"Sorry, I couldn't understand {command!r}")
- id: p-39NCY
  type: prose
  parent: s-F20PN
  order: a3
  body: The wildcard always matches and binds nothing, so it only makes sense on its own as the last case.
    The language enforces that.
- id: s-QJ383
  type: section
  parent: d-XM01W
  order: a7
  fields:
    title: Composing patterns
- id: p-48JMX
  type: prose
  parent: s-QJ383
  order: a1
  body: 'So far we have used three simple patterns: capture patterns, which are bare names like `direction`;
    literal patterns, which are strings, numbers, `True`, `False` and `None`; and the wildcard `_`.'
- id: p-DPRDG
  type: prose
  parent: s-QJ383
  order: a2
  body: Patterns nest. `["first", (left, right), _, *rest]` matches a sequence of at least three items
    whose first item equals `"first"` and whose second item is itself a sequence of two.
- id: s-WPBJP
  type: section
  parent: d-XM01W
  order: a8
  fields:
    title: Or patterns
- id: p-BMBJ1
  type: prose
  parent: s-WPBJP
  order: a1
  body: A vertical bar joins alternatives. The first alternative that matches wins.
- id: cd-07KJV
  type: code
  parent: s-WPBJP
  order: a2
  fields:
    lang: python
  body: |-
    match command.split():
        ...  # Other cases
        case ["north"] | ["go", "north"]:
            current_room = current_room.neighbor("north")
        case ["get", obj] | ["pick", "up", obj] | ["pick", obj, "up"]:
            ...  # Code for picking up the given object
- id: p-RCB6A
  type: prose
  parent: s-WPBJP
  order: a3
  body: Every alternative must bind the same names. `[1, x] | [2, y]` is not allowed, because after a
    successful match it would be unclear which of `x` and `y` had a value.
- id: s-KTM2G
  type: section
  parent: d-XM01W
  order: a9
  fields:
    title: Capturing a sub-pattern
- id: p-BF3RM
  type: prose
  parent: s-KTM2G
  order: a1
  body: The `as` keyword matches whatever is on its left and also binds the matched value to a name.
- id: cd-1CZW0
  type: code
  parent: s-KTM2G
  order: a2
  fields:
    lang: python
  body: |-
    match command.split():
        case ["go", ("north" | "south" | "east" | "west") as direction]:
            current_room = current_room.neighbor(direction)
- id: s-HWQ1E
  type: section
  parent: d-XM01W
  order: aA
  fields:
    title: Adding conditions
- id: p-GHMF1
  type: prose
  parent: s-HWQ1E
  order: a1
  body: A guard adds a boolean test after the pattern. It is checked only if the pattern matched, and
    after all its names have been bound.
- id: cd-YCPWJ
  type: code
  parent: s-HWQ1E
  order: a2
  fields:
    lang: python
  body: |-
    match command.split():
        case ["go", direction] if direction in current_room.exits:
            current_room = current_room.neighbor(direction)
        case ["go", _]:
            print("Sorry, you can't go that way")
- id: p-556X5
  type: prose
  parent: s-HWQ1E
  order: a3
  body: The guard stays out of the pattern, which keeps the pattern declarative.
- id: s-9YJMR
  type: section
  parent: d-XM01W
  order: aB
  fields:
    title: Matching objects
- id: p-V99ZD
  type: prose
  parent: s-9YJMR
  order: a1
  body: Suppose the game is now driven by events from a window. A class pattern checks the type of the
    event and matches its attributes.
- id: cd-AR85A
  type: code
  parent: s-9YJMR
  order: a2
  fields:
    lang: python
  body: |-
    match event.get():
        case Click(position=(x, y)):
            handle_click_at(x, y)
        case KeyPress(key_name="Q") | Quit():
            game.quit()
        case KeyPress(key_name="up arrow"):
            game.go_north()
        ...
        case KeyPress():
            pass  # Ignore other keystrokes
        case other_event:
            raise ValueError(f"Unrecognized event: {other_event}")
- id: p-0P5A7
  type: prose
  parent: s-9YJMR
  order: a3
  body: '`Click(position=(x, y))` matches only if the event''s type is `Click` or a subclass, and then
    matches the nested pattern against its `position` attribute. See {{s-9RT3Q}}.'
- id: s-0VRRF
  type: section
  parent: d-XM01W
  order: aC
  fields:
    title: Matching positional attributes
- id: p-WT87X
  type: prose
  parent: s-0VRRF
  order: a1
  body: A dataclass can be matched positionally, because the dataclass decorator declares the attribute
    order.
- id: cd-MV0HE
  type: code
  parent: s-0VRRF
  order: a2
  fields:
    lang: python
  body: |-
    from dataclasses import dataclass

    @dataclass
    class Click:
        position: tuple
        button: Button

    match event.get():
        case Click((x, y)):
            handle_click_at(x, y)
- id: p-DCT6J
  type: prose
  parent: s-0VRRF
  order: a3
  body: Any class can do the same by declaring {{t-8SX2E}}.
- id: cd-N4SHF
  type: code
  parent: s-0VRRF
  order: a4
  fields:
    lang: python
  body: |-
    class Click:
        __match_args__ = ("position", "button")
        def __init__(self, pos, btn):
            self.position = pos
            self.button = btn
            ...
- id: s-34PBY
  type: section
  parent: d-XM01W
  order: aD
  fields:
    title: Matching against constants
- id: p-F3YRW
  type: prose
  parent: s-34PBY
  order: a1
  body: A dotted name in a pattern is looked up rather than bound, which is how to match an enumeration
    value.
- id: cd-8A6SW
  type: code
  parent: s-34PBY
  order: a2
  fields:
    lang: python
  body: |-
    match event.get():
        case Click((x, y), button=Button.LEFT):  # This is a left click
            handle_click_at(x, y)
        case Click():
            pass  # ignore other clicks
- id: p-EPTMP
  type: prose
  parent: s-34PBY
  order: a3
  body: 'Be careful: a bare name with no dots is always a capture. `case Click((x, y), button=LEFT)` would
    bind `LEFT` to whatever the button was.'
- id: n-MMVXD
  type: note
  parent: s-34PBY
  order: a4
  body: The most common slip in this feature is a bare name where a dotted one was meant. A reader should
    look twice at any capture that shares its spelling with a constant.
- id: s-KTWA5
  type: section
  parent: d-XM01W
  order: aE
  fields:
    title: Matching mappings
- id: p-H0MTC
  type: prose
  parent: s-KTWA5
  order: a1
  body: If actions arrive from the network as dictionaries, mapping patterns pick them apart by key.
- id: cd-GAVNQ
  type: code
  parent: s-KTWA5
  order: a2
  fields:
    lang: python
  body: |-
    for action in actions:
        match action:
            case {"text": message, "color": c}:
                ui.set_text_color(c)
                ui.display(message)
            case {"sleep": duration}:
                ui.wait(duration)
            case {"sound": url, "format": "ogg"}:
                ui.play(url)
            case {"sound": _, "format": _}:
                warning("Unsupported audio format")
- id: p-SKWZD
  type: prose
  parent: s-KTWA5
  order: a3
  body: Keys must be literals; values can be any pattern. Extra keys in the subject are ignored, so a
    pattern with a text key and a color key also matches a dictionary that carries a font key. See {{s-V4ABJ}}.
- id: s-19ZM8
  type: section
  parent: d-XM01W
  order: aF
  fields:
    title: Matching built-in types
- id: p-AHWVS
  type: prose
  parent: s-19ZM8
  order: a1
  body: Any class is a valid match target, including `str`, `int` and `float`. Wrapping a capture in one
    checks the type of data that came from outside.
- id: cd-9R2YK
  type: code
  parent: s-19ZM8
  order: a2
  fields:
    lang: python
  body: |-
    for action in actions:
        match action:
            case {"text": str(message), "color": str(c)}:
                ui.set_text_color(c)
                ui.display(message)
            case {"sleep": float(duration)}:
                ui.wait(duration)
            case {"sound": str(url), "format": "ogg"}:
                ui.play(url)
            case {"sound": _, "format": _}:
                warning("Unsupported audio format")
- id: p-8J92W
  type: prose
  parent: s-19ZM8
  order: a3
  body: Why a single positional argument means "the whole value" for these classes is explained under
    class patterns in {{s-9RT3Q}}.
- id: s-ZEJQA
  type: section
  parent: d-XM01W
  order: aG
  fields:
    title: Worked examples
- id: e-KN4GK
  type: example
  parent: s-ZEJQA
  order: a1
  body: A command line such as `go north` matches the case `["go", direction]`, binds `direction` to `"north"`
    and runs the block that moves the player. The same line also matches the later wildcard, but the first
    matching case wins and the wildcard is never reached.
- id: e-NFFB9
  type: example
  parent: s-ZEJQA
  order: a2
  body: The line `drop sword shield` matches `["drop", *objects]` and binds `objects` to a list of two
    items. The line `drop` alone binds it to an empty list.
- id: n-83VA8
  type: note
  parent: s-ZEJQA
  order: a3
  body: The sample output in this tutorial is formatted for reading and carries no meaning of its own.
- id: p-V1JR0
  type: prose
  parent: s-ZEJQA
  order: a4
  body: The next section holds one very long listing, the parser written out many times over, to show
    how the page copes with it.
- id: s-0TR88
  type: section
  parent: d-XM01W
  order: aH
  fields:
    title: Exercises
- id: p-Q50ZZ
  type: prose
  parent: s-0TR88
  order: a1
  body: Try each of these on the adventure parser.
- id: e-22W8N
  type: example
  parent: s-0TR88
  order: a2
  body: Add a command `use X on Y` that matches a three-word command with the word `on` in the middle.
- id: e-8WXVX
  type: example
  parent: s-0TR88
  order: a3
  body: Make `go` accept either a direction or a room name, and keep the guard that checks the exits.
- id: e-GD12H
  type: example
  parent: s-0TR88
  order: a4
  body: Write a case that matches any command whose last word is `please`, and gives the rest of the line
    to the next case.
- id: e-Q1DVT
  type: example
  parent: s-0TR88
  order: a5
  body: Handle a command that arrives as a dictionary with a verb key and a list of objects.
- id: n-BTMZY
  type: note
  parent: s-0TR88
  order: a6
  body: There is no single right answer to any exercise; each has several readable patterns.
