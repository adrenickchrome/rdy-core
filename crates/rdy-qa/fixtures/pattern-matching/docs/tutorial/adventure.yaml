    # The adventure parser, repeated with numbered comments.

    # --- parser 001 ---
    def parse_command_001(command, current_room, character):
        # 001.1 split the line into words
        match command.split():
            # 001.2 one-word commands
            case ["quit"]:
                return "quit"
            case ["look"]:
                return current_room.describe()
            # 001.3 commands with an object
            case ["get", obj]:
                return character.get(obj, current_room)
            case ["drop", *objects]:
                return [character.drop(obj, current_room) for obj in objects]
            # 001.4 movement, with a guard
            case ["go", direction] if direction in current_room.exits:
                return current_room.neighbor(direction)
            # 001.5 anything else
            case _:
                return "Sorry, I couldn't understand that (001)"

