      - 'no'
      - 'yes'
      - 'no'
      - 'no'
      - 'no'
      - == or is
      - '3.10'
      - none
      - low
      - 'yes'
      - none
      - The singletons use identity.
    - - Capture
      - a bare name
      - '`direction`'
      - 'yes'
      - 'no'
      - 'no'
      - assignment
      - none
      - 'no'
      - 'yes'
      - 'no'
      - never
      - 'no'
      - nothing
      - '3.10'
      - none
      - low
      - 'yes'
      - none
      - Never a dotted name.
    - - Sequence
      - brackets
      - '`[a, *rest]`'
      - 'yes'
      - 'yes'
      - 'yes'
      - subscript
      - many
      - one
      - 'yes'
      - 'yes'
      - never
      - 'no'
      - item by item
      - '3.10'
      - none
      - medium
      - 'yes'
      - length and item reads
      - Not a string or bytes.
- id: p-WFX88
  type: prose
  parent: s-G92P1
  order: a3
  body: 'The second table holds values of every shape a cell may take: text, a list and a map.'
- id: tb-500MS
  type: table
  parent: s-G92P1
  order: a4
  fields:
    columns:
    - Kind
    - Names
    - Detail
    rows:
    - - Capture
      - - a
        - b
      - a list of two names
    - - Mapping
      - keys
      - k: v
- id: s-M8QXS
  type: section
  parent: d-8PBD5
  order: a8
  fields:
    title: Side effects and undefined behaviour
- id: p-G3NAB
  type: prose
  parent: s-M8QXS
  order: a1
  body: The only side effect the matching process produces on purpose is the binding of names. The process
    does, however, rely on attribute access, instance checks, `len()`, equality and item access on the
    subject and its components.
- id: r-2C9EX
  type: requirement
  parent: s-M8QXS
  order: a2
  fields:
    priority: may
  body: Which methods are called, and how many times, is not specified.
- id: p-G9AG4
  type: prose
  parent: s-M8QXS
  order: a3
  body: An implementation may call them once, repeatedly, or not at all where it can decide the outcome
    another way. Likewise it is unspecified whether a name captured earlier in a case block is bound when
    a later subpattern fails.
- id: s-XQQBB
  type: section
  parent: d-8PBD5
  order: a9
  fields:
    title: Standard library support
- id: p-P5F9K
  type: prose
  parent: s-XQQBB
  order: a1
  body: Named tuples and dataclasses define `__match_args__` automatically. For a dataclass the order
    is that of the generated initialiser; fields declared with `init=False` are omitted.
- id: p-KMZN7
  type: prose
  parent: s-XQQBB
  order: a2
  body: Other standard library classes gain `__match_args__` where positional matching is clearly useful.
- id: s-N9350
  type: section
  parent: d-8PBD5
  order: aA
  fields:
    title: Worked examples
- id: p-QBTX1
  type: prose
  parent: s-N9350
  order: a1
  body: Each example gives a subject, a pattern and the outcome.
- id: e-MAX73
  type: example
  parent: s-N9350
  order: a2
  body: 'The subject `[1, 2, 3]` matches `[a, *rest]`: `a` is 1 and `rest` is `[2, 3]`.'
- id: e-X061K
  type: example
  parent: s-N9350
  order: a3
  body: 'The subject `{"k": 1, "j": 2}` matches `{"k": v, **others}`: `v` is 1 and `others` is `{"j":
    2}`.'
- id: e-VV895
  type: example
  parent: s-N9350
  order: a4
  body: The subject `Point(1, 2)` matches `Point(x, y)` when `Point` declares `__match_args__` as `("x",
    "y")`.
- id: e-HB0TQ
  type: example
  parent: s-N9350
  order: a5
  body: The subject `"ab"` does not match `[x, y]`, because a string is not a sequence for matching.
- id: e-SKNCC
  type: example
  parent: s-N9350
  order: a6
  body: The subject `3` matches `1 | 2 | 3` and binds nothing.
- id: e-FN016
  type: example
  parent: s-N9350
  order: a7
  body: The subject `5` matches `n if n > 3` and binds `n` to 5; the guard runs after the capture.
- id: cd-PY7AW
  type: code
  parent: s-N9350
  order: a8
  fields:
    lang: python
  body: |-
    def describe(subject):
        match subject:
            case []:
                return "empty"
            case [one]:
                return "one item"
            case [first, *_]:
                return f"starts with {first!r}"
            case {"k": v}:
                return f"has a k key holding {v!r}"
            case _:
                return "something else"
- id: s-YYDCE
  type: section
  parent: d-8PBD5
  order: aB
  fields:
    title: Compatibility
- id: p-GK09Z
  type: prose
  parent: s-YYDCE
  order: a1
  body: Because `match` and `case` are soft keywords, existing programs keep working unchanged. Tools
    built on a parser that looks one token ahead need to migrate to parse the new statement.
- id: cd-1R2V4
  type: code
  parent: s-YYDCE
  order: a2
  fields:
    lang: python
  body: |-
    # f-strings double a brace to print one; a template engine reads the next line as a placeholder
    print(f"{{subject}} is {subject}")
    template = "Hello \{{ name }}"
