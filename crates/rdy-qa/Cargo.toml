[package]
name = "rdy-qa"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
rdy-model.workspace = true
rdy-schema.workspace = true
rdy-store.workspace = true
rdy-engine.workspace = true
rdy-render.workspace = true
rdy-mcp.workspace = true
rdy-daemon.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tempfile.workspace = true
proptest.workspace = true
postcard.workspace = true
clap.workspace = true
tokio.workspace = true
regex.workspace = true
ssh-key.workspace = true
toml.workspace = true
spdx.workspace = true
sha2.workspace = true
zstd.workspace = true
# the loopback hub fixture of the sync tests and the sync perf rows (`sync_hub`)
rustls.workspace = true
rcgen.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Authorization", "Win32_NetworkManagement_IpHelper", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Memory"] }

[dev-dependencies]
rdy-graph.workspace = true
# the gate's signing tests sign with fixed in-memory test keys only
ed25519-dalek.workspace = true
ssh-key.workspace = true

[lints]
workspace = true

[features]
# Tests of the nightly tier only (`cargo qa --tier nightly`): `mod nightly` in a test file. The
# release tier builds without them.
nightly-tests = []
