[package]
name = "rdy-adapter"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rdy-model.workspace = true
rdy-store.workspace = true
rdy-schema.workspace = true
rdy-engine.workspace = true
rdy-render.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true

[dev-dependencies]
tempfile.workspace = true
# the loopback TLS fixture hub of the two-machine sync tests (test builds only)
rustls.workspace = true
rcgen.workspace = true
# the render entry-point counter the no-render-in-the-holder test reads (test builds only)
rdy-render = { workspace = true, features = ["probe"] }

[lints]
workspace = true

[features]
# Tests of the nightly tier only (`cargo qa --tier nightly`): `mod nightly` in a test file. The
# release tier builds without them.
nightly-tests = []
