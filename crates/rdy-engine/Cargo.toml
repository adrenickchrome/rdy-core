[package]
name = "rdy-engine"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
rdy-model.workspace = true
rdy-schema.workspace = true
rdy-store.workspace = true
rdy-graph.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
semver.workspace = true
saphyr-parser.workspace = true
imbl.workspace = true
arc-swap.workspace = true
regex.workspace = true

[features]
# Test hooks that lower the redaction report's bounds for a test thread
# (`redaction::override_limits_for_tests`). Never enabled by a normal build: only this crate's
# own tests turn it on, through the dev-dependency below.
test-support = []

[dev-dependencies]
rdy-engine = { path = ".", features = ["test-support"] }
tempfile.workspace = true
rdy-graph.workspace = true
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "core"
harness = false

[lints]
workspace = true
