[package]
name = "rdy-engine"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
rdy-model.workspace = true
rdy-schema.workspace = true
rdy-store.workspace = true
rdy-graph.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
semver.workspace = true
saphyr-parser.workspace = true
imbl.workspace = true
arc-swap.workspace = true
regex.workspace = true
ssh-key.workspace = true
ssh-encoding.workspace = true
url.workspace = true
ureq.workspace = true
rustls-native-certs.workspace = true
# The user CA bundle is checked with the TLS library's own trust-anchor parser before connecting
# (ureq's store drops an unreadable root silently). Already in the tree through ureq, with the
# same features; the transport tests' TLS fixture uses it too.
rustls.workspace = true
crc32fast.workspace = true
# Publication artifacts: incremental BLAKE3 over streamed file bytes (`publication_manifest`),
# the same digest as `Hash::of`, which needs the whole file in memory.
blake3.workspace = true
time.workspace = true
# Every log record is compiled out: ureq-proto writes raw request bytes, Authorization included,
# at trace level.
log = { workspace = true, features = ["max_level_off", "release_max_level_off"] }
# A stream render's one anonymous scratch file (`render_source`): unlinked at creation, so it
# needs no cleanup and leaves no name behind.
tempfile.workspace = true

[features]
# Test hooks that lower the redaction report's bounds for a test thread
# (`redaction::override_limits_for_tests`). Never enabled by a normal build: only this crate's
# own tests turn it on, through the dev-dependency below.
test-support = []

[dev-dependencies]
rdy-engine = { path = ".", features = ["test-support"] }
rdy-graph.workspace = true
proptest.workspace = true
criterion.workspace = true
ed25519-dalek.workspace = true
# the hub transport tests' local TLS fixture (with rustls, a normal dependency)
rcgen.workspace = true

[[bench]]
name = "core"
harness = false

[lints]
workspace = true
