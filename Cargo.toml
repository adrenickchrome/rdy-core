[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.4.0"
license = "Apache-2.0"

[workspace.dependencies]
rdy-model = { path = "crates/rdy-model" }
rdy-schema = { path = "crates/rdy-schema" }
rdy-store = { path = "crates/rdy-store" }
rdy-graph = { path = "crates/rdy-graph" }
rdy-engine = { path = "crates/rdy-engine" }
rdy-render = { path = "crates/rdy-render" }
rdy-mcp = { path = "crates/rdy-mcp" }
rdy-daemon = { path = "crates/rdy-daemon" }
blake3 = "1.8"
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
redb = "4"
minijinja = "2"
rmcp = { version = "3", features = ["server", "transport-io", "transport-async-rw"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
rand = "0.10"
schemars = "1"
anyhow = "1"
proptest = "1"
criterion = "0.8"
tempfile = "3"
semver = "1"
saphyr-parser = "0.1"
libc = "0.2.190"
regex = "1.13.1"
imbl = "7"
arc-swap = "1"
ttf-parser = "0.25"
pdf-writer = "0.15"
subsetter = { version = "0.2", default-features = false }
miniz_oxide = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.dev]
# Line tables keep backtraces with file:line but drop full debug info: test binaries link
# much faster (an outside review measured a one-line-edit rebuild going from 3m13s to 1m08s).
debug = "line-tables-only"
