[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.51.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rdy-diagram = { path = "crates/rdy-diagram" }
rdy-model = { path = "crates/rdy-model" }
rdy-schema = { path = "crates/rdy-schema" }
rdy-store = { path = "crates/rdy-store" }
rdy-graph = { path = "crates/rdy-graph" }
rdy-engine = { path = "crates/rdy-engine" }
rdy-render = { path = "crates/rdy-render" }
rdy-mcp = { path = "crates/rdy-mcp" }
rdy-daemon = { path = "crates/rdy-daemon" }
blake3 = "1.8"
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
redb = "4"
minijinja = "2"
rmcp = { version = "=3.9.0", features = ["server", "transport-io", "transport-async-rw", "transport-streamable-http-server", "elicitation"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
rand = "0.10"
schemars = "1"
anyhow = "1"
proptest = "1"
criterion = "0.8"
tempfile = "3"
semver = "1"
saphyr-parser = "0.1"
# Markdown import: the CommonMark event parser (tables through `Options`), in rdy-engine only.
pulldown-cmark = { version = "=0.13.6", default-features = false }
libc = "0.2.190"
# Win32 bindings, only in the platform seams: the site socket's Windows option
# (SO_EXCLUSIVEADDRUSE, D-FPKPS) in rdy_daemon::sys, handle identity, change time and link
# count in rdy_store::fileid, and hole punching (FSCTL_SET_SPARSE, FSCTL_SET_ZERO_DATA) and
# allocated bytes, private security descriptors (a token's user, a protected DACL),
# reparse-point refusals, and opens relative to a directory handle (NtOpenFile, in Wdk), in
# rdy_store::pio. The version tokio, mio and socket2 already lock.
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading"] }
regex = "1.13.1"
imbl = "7"
arc-swap = "1"
skrifa = { version = "=0.48.0", default-features = false, features = ["std"] }
pdf-writer = "0.15"
subsetter = { version = "0.2", default-features = false }
miniz_oxide = "0.9"
# SSH signatures: public-key decoding, fingerprints, SSHSIG encoding and verification. No private-key
# parser, reader or generator is used by product code.
ssh-key = { version = "=0.6.7", default-features = false, features = ["std", "ed25519"] }
ssh-encoding = { version = "=0.2.0", default-features = false, features = ["std", "base64"] }
# Test-only: the in-memory software signer of the signing tests.
ed25519-dalek = { version = "=2.2.0", default-features = false }
# Hub client: canonical HTTPS origins and URLs (IDNA, host case, default ports).
url = "=2.5.7"
# Hub client: the blocking HTTPS transport (Rustls backend only).
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
# Hub client: the platform's trusted root certificates.
rustls-native-certs = "=0.8.2"
# Hub client: the CRC-32/ISO-HDLC checksum of a hub token's form.
crc32fast = "=1.5.0"
# Hub client: RFC3339 instants and challenge expiry.
time = { version = "=0.3.55", features = ["parsing", "formatting"] }
# Dependency logging facade; the engine caps it at compile time so no record is ever written.
log = "=0.4.34"
# Diagrams: Mermaid source drawn as SVG, behind rdy-diagram alone (D-FY4VF, D-KAGB2).
mmdflux = { version = "=2.6.1", default-features = false }
# QA release notices: Cargo.lock parsing.
toml = { version = "=0.9.8", default-features = false, features = ["parse", "serde", "std"] }
# QA release notices: SPDX license expressions.
spdx = { version = "=0.13.6", default-features = false }
# QA release notices: the SHA-256 of retained source archives.
sha2 = "=0.10.9"
# MCP over HTTP: the project bearer's 32 random bytes, from the operating system's source. The
# version rand already locks.
getrandom = { version = "=0.4.3", default-features = false }
# MCP over HTTP: the constant-time comparison of a presented bearer. The version the lock already
# holds.
subtle = { version = "=2.6.1", default-features = false }
# MCP over HTTP: the daemon's HTTP/1 bridge behind the site's head guard (one request per
# connection; chunked bodies and SSE framing). Server and HTTP/1 only.
hyper = { version = "=1.11.1", default-features = false, features = ["server", "http1"] }
# MCP over HTTP: the Tokio adapter for that bridge's socket. Its Tokio I/O adapter only.
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
# Test-only: the local TLS fixture.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Test-only: the local TLS fixture's generated certificates.
rcgen = "=0.14.5"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.dev]
# Line tables keep backtraces with file:line but drop full debug info: test binaries link
# much faster (an outside review measured a one-line-edit rebuild going from 3m13s to 1m08s).
debug = "line-tables-only"
