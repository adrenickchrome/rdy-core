# actionlint 1.7.12 predates this standard GitHub-hosted image label.
# Verified in https://github.com/actions/runner-images/blob/main/README.md on 2026-10-22.
# This is a linter-only compatibility list; workflows do not use self-hosted runners.
self-hosted-runner:
  labels:
    - ubuntu-26.04
# actionlint 1.7.12 does not know the concurrency key `queue`. The evidence sealer's job-level `queue: max`
# is the one exception (orchestrator ruling C1, 2026-11-08): this one path, this one message. A test pins it.
paths:
  .github/workflows/release-evidence.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
